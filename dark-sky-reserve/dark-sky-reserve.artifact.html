<title>Dark Sky Reserve</title>
<style>
:root{
  --ink:#dfe6e2;
  --dim:#8b9a92;
  --edge:rgba(190,215,200,.16);
  --glass:rgba(8,13,12,.82);
  --glow:#9fd8b4;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05070a;overflow:hidden;
  font-family:var(--font);color:var(--ink);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
body.playing canvas#view{cursor:none}
/* pointer lock refused: the cursor has to stay, and grabbing it is the gesture */
body.dragLook canvas#view{cursor:grab}
body.dragLook canvas#view:active{cursor:grabbing}

/* a CSS vignette that survives even if post-processing is switched off */
#vignetteFallback{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 78% 78% at 50% 50%,transparent 40%,rgba(0,0,0,.30) 100%);
  opacity:0;transition:opacity .4s}
body.noPost #vignetteFallback{opacity:1}

/* ---------------- gate ---------------- */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;
  background:radial-gradient(ellipse 120% 90% at 50% 46%,rgba(4,8,7,.45),rgba(3,5,7,.93));
  backdrop-filter:blur(2px);transition:opacity .6s ease,visibility .6s}
.overlay.gone{opacity:0;visibility:hidden;pointer-events:none}
.gateInner{max-width:640px;padding:32px 34px;text-align:center}
.gateInner h1{margin:0 0 .5rem;font-size:clamp(29px,6.2vw,60px);font-weight:200;letter-spacing:.20em;line-height:1.15;
  text-transform:uppercase;text-indent:.24em;
  background:linear-gradient(180deg,#f2f7f3,#93b6a4);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(150,215,180,.20))}
.sub{margin:0 0 26px;color:var(--dim);font-size:15px;font-weight:300;letter-spacing:.02em}
#loadWrap{width:260px;margin:0 auto}
#loadBar{height:2px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden}
#loadBar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#5d8f76,var(--glow));
  transition:width .28s ease}
#loadMsg{margin-top:10px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#playBtn{appearance:none;border:1px solid var(--edge);background:rgba(160,215,185,.07);color:var(--ink);
  font:inherit;font-size:14px;letter-spacing:.2em;text-transform:uppercase;
  padding:15px 40px;border-radius:2px;cursor:pointer;transition:.22s}
#playBtn:hover{background:rgba(160,215,185,.15);border-color:rgba(190,235,210,.42);
  box-shadow:0 0 34px rgba(120,200,160,.18)}
.keys{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:7px 16px;
  margin:26px 0 0;padding:0;font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.keys b{color:#c3d6cb;font-weight:500}
.note{margin:20px 0 0;font-size:11px;color:#61706a;line-height:1.65;max-width:460px;
  margin-left:auto;margin-right:auto}

/* ---------------- hud ---------------- */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;
  opacity:1;transition:opacity .35s}
#hud.hidden{opacity:0}
#compass{position:fixed;top:18px;left:50%;transform:translateX(-50%);
  width:min(320px,52vw);height:22px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
#compassTape{position:absolute;top:0;left:0;height:100%;white-space:nowrap;
  font-size:10.5px;letter-spacing:.2em;color:rgba(214,232,222,.62);line-height:22px}
#compassTape span{display:inline-block;text-align:center}
#compassPin{position:absolute;left:50%;top:0;width:1px;height:7px;
  background:rgba(190,235,210,.75);transform:translateX(-50%)}
#readout{position:fixed;left:20px;bottom:18px;display:flex;flex-direction:column;gap:4px;
  font-size:11px;letter-spacing:.11em;color:rgba(190,212,200,.5);
  font-variant-numeric:tabular-nums}
#hint{position:fixed;right:20px;bottom:18px;font-size:10.5px;letter-spacing:.13em;
  color:rgba(190,212,200,.32)}

/* ---------------- settings panel ---------------- */
#panel{position:fixed;top:0;right:0;z-index:50;width:min(360px,92vw);height:100%;
  background:var(--glass);backdrop-filter:blur(14px);
  border-left:1px solid var(--edge);display:flex;flex-direction:column;
  transform:translateX(0);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#panel.hidden{transform:translateX(101%)}
#panel header{display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 14px;border-bottom:1px solid var(--edge)}
#panel h2{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:#cfe0d6}
#panelClose{background:none;border:0;color:var(--dim);font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
#panelClose:hover{color:var(--ink)}
#panelBody{flex:1;overflow-y:auto;padding:8px 20px 20px;scrollbar-width:thin}
#panel footer{padding:14px 20px;border-top:1px solid var(--edge);display:flex;gap:8px;flex-wrap:wrap}
#panel footer button{flex:1 1 30%;min-width:88px;appearance:none;border:1px solid var(--edge);background:transparent;
  color:var(--dim);font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:10px;border-radius:2px;cursor:pointer;transition:.18s}
#panel footer button:hover{color:var(--ink);border-color:rgba(190,235,210,.4)}
.grp{margin:20px 0 4px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(159,216,180,.55);padding-bottom:6px;border-bottom:1px solid rgba(190,215,200,.08)}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}
.row label{flex:1;font-size:12.5px;color:#b7c8bf;font-weight:300}
.row .val{font-size:11px;color:var(--dim);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.row input[type=range]{flex:0 0 130px;appearance:none;height:2px;background:rgba(255,255,255,.13);
  border-radius:2px;outline:none;cursor:pointer}
.row input[type=range]::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--glow);cursor:pointer;box-shadow:0 0 8px rgba(120,200,160,.5)}
.row input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--glow)}
.row select{flex:0 0 130px;background:rgba(255,255,255,.05);border:1px solid var(--edge);
  color:var(--ink);font:inherit;font-size:12px;padding:6px 8px;border-radius:2px;cursor:pointer}
.row select option{background:#0b1210}
.sw{flex:0 0 38px;height:20px;border-radius:20px;background:rgba(255,255,255,.1);
  border:1px solid var(--edge);position:relative;cursor:pointer;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:var(--dim);transition:.2s}
.sw.on{background:rgba(120,200,160,.28);border-color:rgba(159,216,180,.5)}
.sw.on::after{left:20px;background:var(--glow)}
.hintline{font-size:10.5px;color:#5e6e68;line-height:1.6;margin:6px 0 2px}

/* ---------------- toast ---------------- */
#toast{position:fixed;left:50%;bottom:64px;transform:translate(-50%,10px);z-index:60;
  padding:9px 18px;border:1px solid var(--edge);background:var(--glass);border-radius:2px;
  font-size:11.5px;letter-spacing:.1em;color:#c3d6cb;opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------------- touch ---------------- */
#stick{position:fixed;z-index:25;width:118px;height:118px;border-radius:50%;
  border:1px solid rgba(190,215,200,.2);display:none;pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
  border-radius:50%;background:rgba(190,235,210,.18);border:1px solid rgba(190,235,210,.35)}
body.touch #stick{display:block}
@media (max-width:640px){ #hint{display:none} .keys{display:none} }

</style>

<canvas id="view"></canvas>

<div id="vignetteFallback"></div>

<!-- ================= title / click-to-play ================= -->
<div id="gate" class="overlay">
  <div class="gateInner">
    <h1>Dark Sky&nbsp;Reserve</h1>
    <p class="sub">A night walk out under the darkest skies in Britain.</p>
    <div id="loadWrap"><div id="loadBar"><i></i></div><div id="loadMsg">preparing the field&hellip;</div></div>
    <button id="playBtn" hidden>Enter the field</button>
    <ul class="keys" id="gateKeys" hidden>
      <li><b>W A S D</b> walk</li>
      <li><b>Shift</b> run</li>
      <li><b>Space</b> hop</li>
      <li><b>C</b> crouch</li>
      <li><b>Mouse</b> look</li>
      <li><b>O</b> settings</li>
      <li><b>H</b> hide interface</li>
      <li><b>M</b> sound</li>
      <li><b>Esc</b> release cursor</li>
    </ul>
    <p class="note" id="gateNote"></p>
  </div>
</div>

<!-- ================= heads-up display ================= -->
<div id="hud" class="hidden">
  <div id="compass"><div id="compassTape"></div><div id="compassPin"></div></div>
  <div id="readout">
    <span id="rFps">--</span>
    <span id="rWind">--</span>
    <span id="rPos">--</span>
  </div>
  <div id="hint">O &middot; settings &nbsp; H &middot; hide &nbsp; Esc &middot; cursor</div>
</div>

<!-- ================= settings ================= -->
<div id="panel" class="hidden">
  <header><h2>Settings</h2><button id="panelClose" title="Close">&times;</button></header>
  <div id="panelBody"></div>
  <footer>
    <button id="btnReset">Reset to defaults</button>
    <button id="btnShot">Save a frame</button>
    <button id="btnDiag" title="Copy renderer details to the clipboard">Diagnostics</button>
  </footer>
</div>

<div id="toast"></div>

/* =====================================================================
   Dark Sky Reserve - a walkable night landscape.

   The sky you are standing under is the original 360 photograph, mapped
   onto a dome. That part is exact: stars are far enough away that a
   panorama IS a correct sky, no matter how far you walk.

   Everything below the skyline is rebuilt as real geometry, because a
   photograph has no depth and cannot be walked into. The grass is a few
   hundred thousand instanced blades whose colour, density and falloff
   were measured off the photograph's own pixels (tools/build_sky.py),
   so the reconstruction lands on the same palette rather than a guess.
   ===================================================================== */

   than evaluating noise live is what keeps the ground the player walks on
   bit-identical to the ground the vertex shader draws - hash functions
   famously disagree between CPU and GPU, and a mismatch there shows up as
   the camera sinking into or floating over the field.                    */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Tileable value noise on an N x N integer lattice. */
function latticeNoise(nx, ny, rnd) {
  const g = new Float32Array(nx * ny);
  for (let i = 0; i < g.length; i++) g[i] = rnd();
  return g;
}

function sampleLattice(g, nx, ny, x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let fx = x - xi, fy = y - yi;
  fx = fx * fx * (3 - 2 * fx);
  fy = fy * fy * (3 - 2 * fy);
  const x0 = ((xi % nx) + nx) % nx, y0 = ((yi % ny) + ny) % ny;
  const x1 = (x0 + 1) % nx, y1 = (y0 + 1) % ny;
  const a = g[y0 * nx + x0], b = g[y0 * nx + x1], c = g[y1 * nx + x0], d = g[y1 * nx + x1];
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
}

/**
 * Tileable fractal noise over [0,1)^2. `bx` and `by` are the lattice
 * resolutions of the first octave and every octave doubles both, so the
 * result always tiles at period 1. Independent x and y resolutions let a
 * field be stretched into streaks without breaking the tiling - which is
 * how the worn tracks and the mat of thatch get their direction.
 */
function makeFbm2(seed, bx, by, octaves, gain) {
  const layers = [];
  const rnd = mulberry32(seed);
  for (let o = 0; o < octaves; o++) {
    const nx = bx << o, ny = by << o;
    layers.push({ nx, ny, g: latticeNoise(nx, ny, rnd), amp: Math.pow(gain, o) });
  }
  const norm = 1 / layers.reduce((s, l) => s + l.amp, 0);
  return (u, v) => {
    let s = 0;
    for (const l of layers) s += l.amp * sampleLattice(l.g, l.nx, l.ny, u * l.nx, v * l.ny);
    return s * norm;
  };
}

/** Isotropic case of makeFbm2. */
function makeFbm(seed, base, octaves, gain) {
  return makeFbm2(seed, base, base, octaves, gain);
}

/* ------------------------------------------------------------- wind --
   Real wind is not a sine wave. It sits mostly below its own peaks: long
   lulls, then a gust that builds and dies over a few seconds, with the
   direction veering as it does. That shape is what layered 1/f noise in
   TIME gives you, so the field gets one of those rather than a clock. */

function makeWindNoise(seed) {
  const N = 1024;
  const rnd = mulberry32(seed);
  const g = new Float32Array(N);
  for (let i = 0; i < N; i++) g[i] = rnd();
  const at = (x) => {
    const i = Math.floor(x);
    let f = x - i;
    f = f * f * (3 - 2 * f);
    const a = g[((i % N) + N) % N], b = g[((((i + 1) % N)) + N) % N];
    return a + (b - a) * f;
  };
  return (t, octaves) => {
    let sum = 0, amp = 1, tot = 0, fr = 1;
    for (let o = 0; o < (octaves || 4); o++) {
      sum += amp * at(t * fr);
      tot += amp;
      amp *= 0.55;
      fr *= 2.13;
    }
    return sum / tot;
  };
}

/* --------------------------------------------------------- settings -- */
const SETTINGS_KEY = 'grassfield.settings.v1';

function loadSettings(defaults) {
  const s = Object.assign({ _touched: false }, defaults);
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) {
      const j = JSON.parse(raw);
      for (const k in defaults) if (k in j && typeof j[k] === typeof defaults[k]) s[k] = j[k];
      s._touched = !!j._touched;
    }
  } catch (e) { /* private mode, blocked storage - defaults are fine */ }
  return s;
}

function saveSettings(s) {
  /* Marks the settings as the user's own, so first-run device defaults
     are applied once and never override a deliberate choice later. */
  s._touched = true;
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) {}
}


/* ---- 20-gl.js -------------------------------------------------- */
/* ===================================================================
   Thin WebGL2 layer. No framework: the whole renderer is four passes
   and a handful of programs, and hand-rolling it keeps the page a
   single file with nothing to install.
   =================================================================== */

class GL {
  constructor(canvas) {
    const opts = {
      alpha: false, antialias: false, depth: true, stencil: false,
      powerPreference: 'high-performance'
      // NB: no preserveDrawingBuffer. It makes the browser keep and copy a
      // second full-size buffer every frame, which at Retina resolutions is
      // tens of megabytes of pure overhead. "Save a frame" instead calls
      // toBlob inside the same task as the draw, while the buffer is valid.
    };
    const gl = canvas.getContext('webgl2', opts);
    if (!gl) throw new Error('WEBGL2_UNAVAILABLE');
    this.gl = gl;
    this.canvas = canvas;

    // Half-float render targets give us the headroom for physically-sane
    // night radiance and a bloom that responds to the galactic core.
    this.extHalf = gl.getExtension('EXT_color_buffer_half_float');
    this.extFloat = gl.getExtension('EXT_color_buffer_float');
    this.extLinear = gl.getExtension('OES_texture_float_linear');
    this.extAniso = gl.getExtension('EXT_texture_filter_anisotropic');
    this.maxAniso = this.extAniso
      ? gl.getParameter(this.extAniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 1;
    this.hdrFormat = (this.extHalf || this.extFloat) ? gl.RGBA16F : gl.RGBA8;
    this.hdr = this.hdrFormat === gl.RGBA16F;
  }

  /* ------------------------------------------------------------ shaders */
  compile(type, src, label) {
    const gl = this.gl;
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh) || '';
      const numbered = src.split('\n')
        .map((l, i) => String(i + 1).padStart(4) + ' | ' + l).join('\n');
      console.error('shader failed: ' + label + '\n' + log + '\n' + numbered);
      throw new Error('shader ' + label + ': ' + log.split('\n')[0]);
    }
    return sh;
  }

  program(vsSrc, fsSrc, label) {
    const gl = this.gl;
    const p = gl.createProgram();
    const vs = this.compile(gl.VERTEX_SHADER, vsSrc, label + '.vert');
    const fs = this.compile(gl.FRAGMENT_SHADER, fsSrc, label + '.frag');
    gl.attachShader(p, vs); gl.attachShader(p, fs);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error('link ' + label + ': ' + gl.getProgramInfoLog(p));
    gl.deleteShader(vs); gl.deleteShader(fs);

    // Cache every active uniform location up front; `u.name` beats a
    // getUniformLocation call in the middle of a hot frame.
    const u = Object.create(null);
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      const name = info.name.replace(/\[0\]$/, '');
      u[name] = gl.getUniformLocation(p, name);
    }
    p.u = u;
    p.label = label;
    return p;
  }

  /* ----------------------------------------------------------- buffers */
  buffer(target, data, usage) {
    const gl = this.gl;
    const b = gl.createBuffer();
    gl.bindBuffer(target, b);
    gl.bufferData(target, data, usage || gl.STATIC_DRAW);
    return b;
  }

  /* ---------------------------------------------------------- textures */
  texture(opts) {
    const gl = this.gl;
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    const wrap = opts.wrap || gl.CLAMP_TO_EDGE;
    const filt = opts.filter === undefined ? gl.LINEAR : opts.filter;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, opts.wrapT || wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER,
      opts.mips ? gl.LINEAR_MIPMAP_LINEAR : filt);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
    if (opts.image) {
      gl.texImage2D(gl.TEXTURE_2D, 0, opts.internal || gl.RGBA8, opts.format || gl.RGBA,
        opts.type || gl.UNSIGNED_BYTE, opts.image);
    } else {
      gl.texImage2D(gl.TEXTURE_2D, 0, opts.internal || gl.RGBA8, opts.w, opts.h, 0,
        opts.format || gl.RGBA, opts.type || gl.UNSIGNED_BYTE, opts.data || null);
    }
    if (opts.mips) gl.generateMipmap(gl.TEXTURE_2D);
    if (opts.aniso && this.extAniso) {
      gl.texParameterf(gl.TEXTURE_2D, this.extAniso.TEXTURE_MAX_ANISOTROPY_EXT,
        Math.min(opts.aniso, this.maxAniso));
    }
    t.width = opts.w || (opts.image ? opts.image.width : 0);
    t.height = opts.h || (opts.image ? opts.image.height : 0);
    return t;
  }

  /* -------------------------------------------------------------- FBOs */
  target(w, h, opts) {
    const gl = this.gl;
    opts = opts || {};
    const internal = opts.internal || (this.hdr ? gl.RGBA16F : gl.RGBA8);
    const type = opts.type || (internal === gl.RGBA16F ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE);
    const tex = this.texture({
      w, h, internal, type, format: gl.RGBA,
      filter: opts.filter === undefined ? gl.LINEAR : opts.filter
    });
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    let depth = null;
    if (opts.depth) {
      depth = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
    }
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok) throw new Error('incomplete framebuffer ' + w + 'x' + h);
    return { fbo, tex, depth, w, h,
      free: () => { gl.deleteFramebuffer(fbo); gl.deleteTexture(tex);
                    if (depth) gl.deleteRenderbuffer(depth); } };
  }

  /**
   * Same as target(), but the scene is rasterised into multisampled
   * renderbuffers and resolved into the texture afterwards.
   *
   * Grass is the worst case there is for aliasing: hundreds of thousands
   * of near-vertical shapes a pixel or less across. Without this they
   * break into crawling dashes whenever the wind moves them, and no
   * amount of shading work hides it.
   */
  targetMS(w, h, samples, opts) {
    const gl = this.gl;
    opts = opts || {};
    /* the resolve target needs no depth of its own - depth lives on the
       multisampled side and is never read back */
    const resolved = this.target(w, h, Object.assign({}, opts, { depth: false }));
    const fmt = opts.internal || (this.hdr ? gl.RGBA16F : gl.RGBA8);
    let max = 0;
    try {
      const counts = gl.getInternalformatParameter(gl.RENDERBUFFER, fmt, gl.SAMPLES);
      max = counts && counts.length ? counts[0] : 0;
    } catch (e) { max = 0; }
    const n = Math.min(samples, max, gl.getParameter(gl.MAX_SAMPLES) || 0);
    if (n < 2) { resolved.free(); return this.target(w, h, opts); }

    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    const col = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, col);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, n, fmt, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, col);
    const dep = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, dep);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, n, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, dep);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok) {
      gl.deleteFramebuffer(fbo); gl.deleteRenderbuffer(col); gl.deleteRenderbuffer(dep);
      resolved.free();
      return this.target(w, h, opts);
    }

    const inner = resolved.free;
    resolved.msFbo = fbo;
    resolved.samples = n;
    resolved.resolve = () => {
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, resolved.fbo);
      gl.blitFramebuffer(0, 0, w, h, 0, 0, w, h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    };
    resolved.free = () => {
      inner();
      gl.deleteFramebuffer(fbo); gl.deleteRenderbuffer(col); gl.deleteRenderbuffer(dep);
    };
    return resolved;
  }

  bindTarget(t, forDraw) {
    const gl = this.gl;
    if (t) {
      /* draw into the multisampled side when there is one */
      const f = (forDraw && t.msFbo) ? t.msFbo : t.fbo;
      gl.bindFramebuffer(gl.FRAMEBUFFER, f);
      gl.viewport(0, 0, t.w, t.h);
    }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null);
           gl.viewport(0, 0, this.canvas.width, this.canvas.height); }
  }

  bindTex(unit, tex) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
  }
}

/* IEEE-754 binary32 -> binary16. R16F storage wants half-float data; the
   spec also permits handing it FLOAT and letting the driver convert, but
   that conversion path is exactly the sort of thing implementations
   disagree about, and a height texture that reads back wrong puts every
   blade of grass somewhere other than the ground. */
function toHalfFloat(src) {
  const out = new Uint16Array(src.length);
  const f = new Float32Array(1);
  const i = new Int32Array(f.buffer);
  for (let k = 0; k < src.length; k++) {
    f[0] = src[k];
    const x = i[0];
    const sign = (x >>> 16) & 0x8000;
    let exp = (x >>> 23) & 0xff;
    let man = x & 0x7fffff;
    if (exp === 255) { out[k] = sign | 0x7c00 | (man ? 0x200 : 0); continue; }
    let e = exp - 127 + 15;
    if (e >= 31) { out[k] = sign | 0x7c00; continue; }
    if (e <= 0) {
      if (e < -10) { out[k] = sign; continue; }
      man = (man | 0x800000) >> (1 - e);
      out[k] = sign | (man >> 13);
      continue;
    }
    out[k] = sign | (e << 10) | (man >> 13);
  }
  return out;
}

/* A single oversized triangle covers the screen with no seam down the
   middle and one fewer vertex than a quad. Used by every full-screen pass. */
const FULLSCREEN_VS = `#version 300 es
out vec2 vUv;
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;


/* ---- 30-shaders.js --------------------------------------------- */
/* ===================================================================
   Shared GLSL. Every pass pastes CHUNK.common in, so the sky lookup,
   the lighting model and the fog are literally the same code in the
   sky, the terrain and the grass - which is why they meet at the
   skyline without a seam.
   =================================================================== */

const CHUNK = {};

CHUNK.head = `#version 300 es
precision highp float;
precision highp int;
`;

CHUNK.common = `
const float PI  = 3.14159265359;
const float TAU = 6.28318530718;

/* ---- colour space ---- */
vec3 srgbToLinear(vec3 c){
  return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), c));
}
vec3 linearToSrgb(vec3 c){
  c = max(c, vec3(0.0));
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c));
}
float luma(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

/* One non-finite pixel anywhere in the scene is not a lost pixel - it is
   a lost rectangle. The bloom chain averages it into a texel, each mip
   level quadruples the area that texel covers, and it comes back as a
   black block a few hundred pixels across. Comparing a value with itself
   is the portable NaN test; the clamp catches infinities. */
vec3 sanitise(vec3 c){
  c = mix(vec3(0.0), c, vec3(equal(c, c)));
  return clamp(c, vec3(0.0), vec3(1.0e4));
}

/* ---- hashing (Dave Hoskins style: no sin, stable across drivers) ---- */
float hash11(float p){
  p = fract(p * 0.1031);
  p *= p + 33.33;
  p *= p + p;
  return fract(p);
}
vec2 hash21(float p){
  vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xx + p3.yz) * p3.zy);
}
vec3 hash31(float p){
  vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.xxy + p3.yzz) * p3.zyx);
}
vec4 hash41(float p){
  vec4 p4 = fract(vec4(p) * vec4(0.1031, 0.1030, 0.0973, 0.1099));
  p4 += dot(p4, p4.wzxy + 33.33);
  return fract((p4.xxyz + p4.yzzw) * p4.zywx);
}
/* Hash a 2D lattice cell. Feeding a raw instance id into a hash is a
   precision trap: at 900k instances the value needs 20 bits of mantissa
   before fract() ever runs, leaving about 4 bits of randomness. Cell
   coordinates stay small, so this is both better distributed and stable
   in world space - a blade keeps its identity no matter how the grid
   covering it happens to be indexed this frame. */
vec4 hash42(vec2 p){
  vec4 p4 = fract(p.xyxy * vec4(0.1031, 0.1030, 0.0973, 0.1099));
  p4 += dot(p4, p4.wzxy + 33.33);
  return fract((p4.xxyz + p4.yzzw) * p4.zywx);
}

vec3 hash33(vec3 p3){
  p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yxx) * p3.zyx);
}

/* =====================================================================
   The sky.
   uSky holds the original photograph as a 2:1 equirectangular dome.
   The build step lifted the black point to stop JPEG blocking in the
   deep sky; uSkyLift/uSkyScale undo that exactly.
   ===================================================================== */
uniform sampler2D uSky;
uniform float uSkyLift;
uniform float uSkyScale;
uniform float uHighlightBoost;
uniform float uTime;

vec2 dirToEquirect(vec3 d){
  /* looking exactly at the pole makes both arguments zero, and atan(0,0)
     is undefined - any azimuth will do there, so pick one */
  float az = (abs(d.x) + abs(d.z) < 1.0e-9) ? 0.0 : atan(d.x, -d.z);
  return vec2(az * 0.15915494 + 0.5,
              acos(clamp(d.y, -1.0, 1.0)) * 0.31830989);
}

/* Photograph as linear radiance, black point restored. */
vec3 skyPlate(vec3 d){
  vec3 c = textureLod(uSky, dirToEquirect(d), 0.0).rgb;
  c = max((c - uSkyLift) / uSkyScale, vec3(0.0));
  return srgbToLinear(c);
}

/* An 8-bit photograph has no headroom, so nothing in it would ever bloom.
   Re-expanding the top end puts the galactic core and the brighter stars
   back above 1.0 where the bloom pass can find them. The lift is driven
   by luminance so the airglow band stays where the photograph put it. */
vec3 skyHDR(vec3 d){
  vec3 c = skyPlate(d);
  float l = luma(c);
  /* Only the top of the range moves. The airglow band and the dust lanes
     stay exactly where the photograph put them; the core and the brighter
     stars get just enough headroom to bloom. */
  float hi = smoothstep(0.15, 0.40, l);
  return c * (1.0 + uHighlightBoost * hi * hi * 1.9);
}

/* =====================================================================
   Lighting.
   uSH is an order-2 spherical-harmonic projection of the sky above,
   baked by tools/build_sky.py. On a night this dark the sky IS the
   light, so this single term carries almost the whole image.
   ===================================================================== */
uniform vec3 uSH[9];

vec3 shIrradiance(vec3 n){
  const float c1 = 0.429043, c2 = 0.511664, c3 = 0.743125,
              c4 = 0.886227, c5 = 0.247708;
  return  c1 * uSH[8] * (n.x*n.x - n.y*n.y)
        + c3 * uSH[6] * (n.z*n.z)
        + c4 * uSH[0]
        - c5 * uSH[6]
        + 2.0 * c1 * (uSH[4]*n.x*n.y + uSH[7]*n.x*n.z + uSH[5]*n.y*n.z)
        + 2.0 * c2 * (uSH[3]*n.x + uSH[1]*n.y + uSH[2]*n.z);
}

/* =====================================================================
   Distance haze.
   Fog is not a grey constant - it is the sky, sampled in the direction
   you are looking, at the height of the horizon. That is what makes the
   far grass dissolve into the green airglow band on the left and the
   warm light dome on the right, exactly as it does in the photograph.
   ===================================================================== */
uniform float uFogDensity;
uniform float uFogTint;

vec3 hazeColour(vec3 viewDir){
  /* Aerial perspective is light scattered in from the WHOLE sky, not just
     the strip on the skyline. Taking only the horizon plate made the far
     field too warm, because the horizon is where the light-pollution
     domes are; folding in the sky's average radiance puts the airglow's
     green back into the distance, where the photograph has it. */
  vec3 h = normalize(vec3(viewDir.x, 0.055, viewDir.z));
  vec3 amb = shIrradiance(vec3(0.0, 1.0, 0.0)) * (1.0 / PI);
  return mix(skyPlate(h), amb * 1.45, 0.42) * uFogTint;
}

float hazeAmount(float dist){
  return 1.0 - exp(-dist * uFogDensity);
}

/* =====================================================================
   Field lookup texture (RGBA8, tiling every uFieldPeriod metres)
     r  gust field       - drives the travelling wind waves
     g  clump height     - tufts and thin patches
     b  comb direction   - the prevailing lie of the grass
     a  bare-ground mask - the trodden paths in the photograph
   ===================================================================== */
uniform sampler2D uField;
uniform float uFieldPeriod;
uniform vec2 uWind;          /* prevailing wind, unit length, world XZ */

vec4 field(vec2 world){ return textureLod(uField, world / uFieldPeriod, 0.0); }
vec4 fieldAt(vec2 world, float scale){ return textureLod(uField, world / (uFieldPeriod * scale), 0.0); }
float fieldR(vec2 world, float scale){ return fieldAt(world, scale).r; }
float fieldG(vec2 world, float scale){ return fieldAt(world, scale).g; }

/* Terrain height, baked to an R16F texture so the CPU (which decides
   where your feet are) and the vertex shader (which decides where the
   ground is drawn) cannot possibly disagree. */
uniform sampler2D uHeight;
uniform float uHeightPeriod;
uniform float uHeightScale;

/* =====================================================================
   Detail texture (RGBA8, tiling every uDetailPeriod metres)

   The field texture above works at tens of metres - swathes, gusts, worn
   tracks. This one works at ONE metre, which is the scale a tussock
   actually is. Trying to carry both in one texture meant sampling the
   coarse field at a tiny scale, and its fine octaves then turned the
   mound signal into noise: the hollows came out speckled instead of
   shaped, and the grass never grouped into tufts.

     r  mound height    - the dome each tussock sits on
     g  local comb      - which way THIS tuft is combed
     b  length          - how long its blades run
     a  spare variation
   ===================================================================== */
uniform sampler2D uDetail;
uniform float uDetailPeriod;
uniform float uTussock;

vec4 detail(vec2 world){ return textureLod(uDetail, world / uDetailPeriod, 0.0); }

float groundHeight(vec2 world){
  return textureLod(uHeight, world / uHeightPeriod, 0.0).r * uHeightScale;
}

/* Grass does not grow on a plane. It grows in tussocks, and the hollows
   between them are where the photograph's blacks come from - there is no
   sky down there at all. A metre-scale mound field on top of the terrain
   is what gives the canopy somewhere to cast those hollows. */
float surfaceHeight(vec2 world){
  return groundHeight(world) + (detail(world).r - 0.5) * uTussock;
}
vec3 groundNormal(vec2 world, float eps){
  float hx = groundHeight(world + vec2(eps, 0.0)) - groundHeight(world - vec2(eps, 0.0));
  float hz = groundHeight(world + vec2(0.0, eps)) - groundHeight(world - vec2(0.0, eps));
  return normalize(vec3(-hx, 2.0 * eps, -hz));
}

/* ---- trample: a decaying footprint map that follows the player ---- */
uniform sampler2D uTrample;
uniform vec3 uTrampleWin;   /* x,y = window origin (world), z = window size */

float trampleAt(vec2 world){
  vec2 uv = (world - uTrampleWin.xy) / uTrampleWin.z;
  if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) return 0.0;
  return textureLod(uTrample, uv, 0.0).r;
}

/* Sky sheen.

   The bright strands in the photograph are not a highlight from one
   light - there isn't one bright enough. They are the whole sky dome
   reflecting off waxy leaf surfaces, which is why they appear on every
   blade turned face-up and why they run silver rather than green. A
   Fresnel-weighted lookup of the sky's own irradiance in the reflected
   direction reproduces them almost for free.                          */
vec3 skySheen(vec3 n, vec3 v, float amount){
  vec3 r = reflect(-v, n);
  /* Leaf cuticle, but a rough one. A textbook Fresnel term runs to 1.0 at
     grazing incidence, and a blade seen edge-on then mirrors whatever is
     on the horizon - which here is a warm light-pollution dome, so the
     whole field turned khaki and grew wiry yellow streaks. Capping the
     grazing response is what a rough surface does anyway. */
  const float f0 = 0.045, fMax = 0.40;
  float f = f0 + (fMax - f0) * pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 4.0);

  /* Part mirror, part diffuse dome. The sharp half is what makes a blade
     turned toward the galactic core glint while its neighbour does not;
     the smooth half stops that from becoming a field of hot wires. */
  vec3 refl = mix(shIrradiance(r) * (1.0 / PI), skyPlate(r), 0.62);
  return refl * f * amount;
}

/* ---- specular ---- */
float ggx(vec3 n, vec3 v, vec3 l, float rough){
  /* v and l cancel when you look straight down the light, and
     normalize(0) is NaN */
  vec3 hv = v + l;
  float hlen = length(hv);
  if (hlen < 1.0e-5) return 0.0;
  vec3 h = hv / hlen;
  float a = max(rough * rough, 1e-3);
  float a2 = a * a;
  float ndh = max(dot(n, h), 0.0);
  float ndv = max(dot(n, v), 1e-4);
  float ndl = max(dot(n, l), 0.0);
  float dd = ndh * ndh * (a2 - 1.0) + 1.0;
  float D = a2 / (PI * dd * dd);
  float k = a * 0.5;
  float G = (ndl / (ndl * (1.0 - k) + k)) * (ndv / (ndv * (1.0 - k) + k));
  return D * G / (4.0 * ndv * ndl + 1e-4);
}
`;

CHUNK.tonemap = `
/* A shoulder, and nothing else.
   ACES and its cousins are built for footage that has to survive a grade.
   Here the source IS a finished photograph, so any curve that lifts or
   crushes the midtones is throwing away the very thing we are trying to
   match. Below the knee this is the identity - the sky comes out of the
   renderer at exactly the value the photograph had - and above it rolls
   off asymptotically so a boosted galactic core glows instead of
   clipping to a white hole. */
vec3 shoulder(vec3 x){
  const float k = 0.55;
  vec3 hi = 1.0 - (1.0 - k) * exp(-(x - k) / (1.0 - k));
  return max(mix(x, hi, step(vec3(k), x)), vec3(0.0));
}
vec3 saturate3(vec3 c, float s){
  return max(mix(vec3(luma(c)), c, s), vec3(0.0));
}
`;

/* Fragment-only. `fwidth` does not exist in a vertex shader, so anything
   that measures its own pixel footprint has to live in its own chunk. */
CHUNK.stars = `
/* Round, twinkling stars for the zenith cap.
   The photograph is cropped at +76 degrees, and anything synthesised into
   an equirect near the pole smears sideways. So the cap in the texture is
   deliberately smooth and the actual points are drawn here, in 3D, where
   they stay round however you tilt your head. Star size follows the
   pixel footprint and brightness is flux-conserved, so they neither
   sparkle-crawl at low resolution nor bloat at high. */
vec3 starfield(vec3 d, float amount){
  if (amount <= 0.001) return vec3(0.0);
  vec3 acc = vec3(0.0);
  for (int layer = 0; layer < 2; ++layer){
    float scale = layer == 0 ? 165.0 : 395.0;
    float bias  = layer == 0 ? 0.9835 : 0.9955;
    vec3 p  = d * scale;
    vec3 id = floor(p);
    vec3 f  = fract(p) - 0.5;
    vec3 h  = hash33(id + float(layer) * 71.3);
    float pick = h.z;
    if (pick < bias) continue;
    vec3 off = (hash33(id + 13.7) - 0.5) * 0.62;
    float dist = length(f - off);

    float px  = max(length(fwidth(p)), 1e-4);
    float rad = max(0.028, px * 0.85);
    float g   = exp(-pow(dist / rad, 2.0) * 2.2);
    g *= min(1.0, (0.028 / rad) * (0.028 / rad));   // conserve flux

    float mag = pow(fract(pick * 91.7), 4.5);
    /* stars low in the sky scintillate hard; overhead they barely move */
    float tw  = 1.0 + mix(0.06, 0.62, pow(1.0 - clamp(d.y, 0.0, 1.0), 3.0))
                    * (hash11(h.x * 733.0 + floor(uTime * 7.0 + h.y * 40.0)) - 0.5) * 2.0;
    vec3 tint = mix(vec3(1.0, 0.86, 0.70), vec3(0.74, 0.83, 1.0), h.y);
    acc += tint * g * (0.06 + mag * 3.4) * max(tw, 0.0);
  }
  return acc * amount;
}

/* Fade the synthetic stars in only where the photograph runs out. */
float zenithBlend(vec3 d){
  return smoothstep(0.80, 0.985, d.y);
}

vec3 skyFull(vec3 d){
  return skyHDR(d) + starfield(d, zenithBlend(d) * 0.85 + 0.05);
}
`;


/* ---- 40-sky.js ------------------------------------------------- */
/* ===================================================================
   Sky pass. One full-screen triangle: for every pixel we rebuild the
   world-space view ray and look the photograph up along it.

   This is the part of the scene that is not a reconstruction. Stars are
   at infinity, so a 360 panorama really is a correct sky - walk a
   kilometre and it should not change, and here it doesn't.
   =================================================================== */

const SKY_FS = CHUNK.head + CHUNK.common + CHUNK.stars + `
in vec2 vUv;
out vec4 oColor;

uniform mat4 uInvViewProj;
uniform vec3 uCamPos;
uniform float uStarAmount;

void main(){
  vec4 far = uInvViewProj * vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
  vec3 dir = normalize(far.xyz / far.w - uCamPos);

  vec3 col = skyHDR(dir);
  col += starfield(dir, (zenithBlend(dir) * 0.85 + 0.06) * uStarAmount);

  /* The photograph's own horizon is a hard cut where its ground began.
     We are drawing our own ground over it, but a few degrees of haze
     below the skyline stop any hairline showing through between blades. */
  float below = smoothstep(0.0, -0.05, dir.y);
  col = mix(col, hazeColour(dir), below * 0.35);

  oColor = vec4(col, 1.0);
}`;

class SkyPass {
  constructor(glw) {
    this.glw = glw;
    this.prog = glw.program(FULLSCREEN_VS, SKY_FS, 'sky');
  }

  draw(env) {
    const gl = this.glw.gl, p = this.prog;
    gl.useProgram(p);
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    env.bindCommon(p);
    gl.uniformMatrix4fv(p.u.uInvViewProj, false, env.invViewProj);
    gl.uniform3fv(p.u.uCamPos, env.camPos);
    gl.uniform1f(p.u.uStarAmount, env.starAmount);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.depthMask(true);
    gl.enable(gl.DEPTH_TEST);
  }
}


/* ---- 50-terrain.js --------------------------------------------- */
/* ===================================================================
   Ground.

   A radial disc that rides along under the camera - dense at your feet,
   coarse at the horizon, out to 900 m. It is the mat of dead thatch and
   soil the blades stand in, and past the last row of blades it becomes
   the whole ground, which is exactly where the haze has taken over.
   =================================================================== */

const TERRAIN_VS = CHUNK.head + CHUNK.common + `
in vec2 aRA;                 /* x: 0..1 along the radius, y: 0..1 around */
uniform mat4 uViewProj;
uniform vec2 uOrigin;
uniform float uMaxR;

out vec3 vWorld;

void main(){
  float r = uMaxR * pow(aRA.x, 2.7);
  float a = aRA.y * TAU;
  vec2 xz = uOrigin + vec2(cos(a), sin(a)) * r;
  vWorld = vec3(xz.x, surfaceHeight(xz), xz.y);
  gl_Position = uViewProj * vec4(vWorld, 1.0);
}`;

const TERRAIN_FS = CHUNK.head + CHUNK.common + `
in vec3 vWorld;
out vec4 oColor;

uniform vec3 uCam;
uniform sampler2D uMat;
uniform vec3 uGrassDark;
uniform vec3 uGrassLight;
uniform vec3 uCoreDir;
uniform vec3 uCoreColour;
uniform float uSpecular;
uniform float uSheen;
uniform float uGroundGain;

/* the mat texture is a directional streak pattern; we spin it to follow
   the local lie of the grass so the ground reads as combed, not tiled */
vec4 matAt(vec2 world, float scale, float ang){
  float c = cos(ang), s = sin(ang);
  mat2 R = mat2(c, -s, s, c);
  return texture(uMat, (R * world) / scale);
}

void main(){
  vec3 V = normalize(uCam - vWorld);
  float dist = length(uCam - vWorld);

  vec4 f = field(vWorld.xz);
  /* The comb is stored as an offset from the prevailing wind rather than
     an absolute bearing: an absolute angle in a byte wraps at 0/1, and
     bilinear filtering across that wrap draws seams across the field. */
  vec4 det = detail(vWorld.xz);
  float ang = atan(uWind.y, uWind.x) + (f.b - 0.5) * 1.55 + (det.g - 0.5) * 1.15;

  /* two octaves at incommensurable scales: kills the visible repeat */
  vec4 m0 = matAt(vWorld.xz, 1.35, ang);
  vec4 m1 = matAt(vWorld.xz, 5.90, ang + 1.1);
  float thatch = m0.a * 0.62 + m1.a * 0.38;

  vec3 nT = normalize(vec3((m0.rg - 0.5) * 1.6 + (m1.rg - 0.5) * 0.7, 1.0));
  float c = cos(-ang), s = sin(-ang);
  vec3 nRot = vec3(nT.x * c - nT.y * s, nT.x * s + nT.y * c, nT.z);
  vec3 gN = groundNormal(vWorld.xz, 1.5);
  /* graft the mat detail onto the terrain slope */
  vec3 N = normalize(vec3(gN.x + nRot.x * 0.55, gN.y, gN.z + nRot.y * 0.55));

  float lay = fieldR(vWorld.xz, 2.6);
  vec3 albedo = mix(uGrassDark, uGrassLight, thatch * 0.55 + f.g * 0.17 + lay * 0.28);
  albedo *= mix(0.42, 1.0, thatch);                  /* self-shadowing of the mat */
  albedo *= mix(0.55, 1.0, smoothstep(0.25, 0.75, f.a));

  /* the mat sits at the bottom of the canopy, so very little sky reaches it */
  float canopy = mix(0.038, 0.30, smoothstep(6.0, 60.0, dist))
               * mix(0.58, 1.0, smoothstep(0.05, 0.85, det.r));
  float tr = trampleAt(vWorld.xz);
  canopy = mix(canopy, canopy * 1.7, tr);            /* flattened grass opens up */

  vec3 amb = shIrradiance(N) * (1.0 / PI) * canopy;
  vec3 spec = uCoreColour * ggx(N, V, uCoreDir, 0.78)
            * max(dot(N, uCoreDir), 0.0) * uSpecular * 0.30;

  vec3 col = albedo * amb * uGroundGain + spec
           + skySheen(N, V, uSheen) * canopy * 1.6;

  col = mix(col, hazeColour(-V), hazeAmount(dist));
  oColor = vec4(col, 1.0);
}`;

class Terrain {
  constructor(glw, rings, segs, maxR) {
    this.glw = glw;
    const gl = glw.gl;
    this.maxR = maxR;
    this.prog = glw.program(TERRAIN_VS, TERRAIN_FS, 'terrain');

    /* radial grid: ring 0 is a degenerate centre point */
    const verts = [];
    for (let i = 0; i <= rings; i++) {
      const t = i / rings;
      for (let j = 0; j <= segs; j++) verts.push(t, j / segs);
    }
    const idx = [];
    const row = segs + 1;
    for (let i = 0; i < rings; i++) {
      for (let j = 0; j < segs; j++) {
        const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
    }
    this.count = idx.length;

    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    glw.buffer(gl.ARRAY_BUFFER, new Float32Array(verts));
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    glw.buffer(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx));
    gl.bindVertexArray(null);
  }

  draw(env) {
    const gl = this.glw.gl, p = this.prog;
    gl.useProgram(p);
    env.bindCommon(p);
    gl.uniformMatrix4fv(p.u.uViewProj, false, env.viewProj);
    gl.uniform3fv(p.u.uCam, env.camPos);
    /* snapping the disc to a coarse grid stops far vertices from
       shimmering as they resample the height field while you walk */
    gl.uniform2f(p.u.uOrigin,
      Math.round(env.camPos[0] / 2.0) * 2.0,
      Math.round(env.camPos[2] / 2.0) * 2.0);
    gl.uniform1f(p.u.uMaxR, this.maxR);
    gl.uniform3fv(p.u.uGrassDark, env.grassDark);
    gl.uniform3fv(p.u.uGrassLight, env.grassLight);
    gl.uniform3fv(p.u.uCoreDir, env.coreDir);
    gl.uniform3fv(p.u.uCoreColour, env.coreColour);
    gl.uniform1f(p.u.uSpecular, env.specular);
    gl.uniform1f(p.u.uSheen, env.sheen);
    gl.uniform1f(p.u.uGroundGain, env.groundGain);
    this.glw.bindTex(4, env.matTex);
    gl.uniform1i(p.u.uMat, 4);

    gl.enable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
    gl.bindVertexArray(this.vao);
    gl.drawElements(gl.TRIANGLES, this.count, gl.UNSIGNED_INT, 0);
    gl.bindVertexArray(null);
  }
}


/* ---- 60-grass.js ----------------------------------------------- */
/* ===================================================================
   Grass.

   Every blade is an instance with no per-instance buffer at all: the
   vertex shader hashes gl_InstanceID into a cell of a grid that is
   re-centred on the camera each frame, so the field is endless and
   costs nothing on the CPU. Four rings of decreasing density and
   segment count carry it from your bootlaces to the skyline.

   The bend is a true circular arc, not a bezier. An arc of fixed length
   cannot stretch, so a blade in a gale is exactly as long as a blade at
   rest - which is the difference between grass and rubber.
   =================================================================== */

const GRASS_VS = CHUNK.head + CHUNK.common + `
in vec2 aV;                  /* x: -1..1 across the blade, y: 0..1 along it */

uniform mat4 uViewProj;
uniform vec3 uCam;
uniform vec2 uFwdXZ;
uniform float uCullDot;

uniform vec2 uOriginCell;    /* integer world cell of grid slot (0,0) */
uniform float uCell;
uniform int  uGridW;
uniform int  uGridH;
uniform int  uInstanceBase;  /* draws are chunked; this is the offset */
uniform vec2 uRange;         /* radial band this ring covers */
uniform vec2 uFadeIn;
uniform vec2 uFadeOut;
uniform float uSeed;

uniform float uBladeHeight;
uniform float uBladeWidth;
uniform float uWidthMul;
uniform float uViewFace;
uniform float uCurve;

uniform float uWindStrength;
uniform float uWindTime;
uniform float uBaseBend;

uniform vec2  uPlayerXZ;
uniform vec2  uPlayerVel;    /* unit heading, zero when standing still */
uniform float uPlayerSpeed;  /* 0..1, normalised against a run */
uniform float uPartRadius;
uniform float uPartStrength;

out vec3 vWorld;
out vec3 vNormal;
out float vT;
out float vColVar;
out float vDist;
out float vAO;

void cull(){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); }

void main(){
  int id = gl_InstanceID + uInstanceBase;
  int gz = id / uGridW;
  if (gz >= uGridH) { cull(); return; }
  vec2 cellF = uOriginCell + vec2(float(id - gz * uGridW), float(gz));

  vec4 h0 = hash42(cellF + uSeed);
  vec2 base = (cellF + 0.5 + (h0.xy - 0.5) * 0.94) * uCell;

  vec2 toCam = base - uCam.xz;
  float dist = length(toCam);
  if (dist < uRange.x || dist > uRange.y) { cull(); return; }
  if (dist > 4.0 && dot(toCam / dist, uFwdXZ) < uCullDot) { cull(); return; }

  vec4 f = field(base);
  /* Tufts at two scales. The photograph's field is organised into broad
     swathes tens of metres across with smaller tussocks inside them; one
     octave of clumping only ever gives you an even stipple. */
  float clump = clamp(f.g * 0.52 + fieldG(base, 3.1) * 0.48, 0.0, 1.0);
  float bare  = f.a;
  /* thinner patches and the worn tracks that run through the photograph */
  if (h0.w > mix(0.30, 1.0, smoothstep(0.26, 0.66, bare))) { cull(); return; }

  float fade = smoothstep(uFadeIn.x, uFadeIn.y, dist)
             * (1.0 - smoothstep(uFadeOut.x, uFadeOut.y, dist));
  if (fade < 0.02) { cull(); return; }

  vec4 h1 = hash42(cellF * 1.6180339 + (uSeed + 7.31));

  /* The same mound field the ground is displaced by. Grass grows longer
     on a tussock and thins out in the hollow between them, and coupling
     the two is what turns a flat sward into the lumpy, shadowed surface
     the photograph has. */
  vec4 det = detail(base);
  float mound = det.r;

  /* how tall this blade is relative to the others in its own tuft */
  float rel   = 0.40 + 0.98 * pow(clamp(h1.x, 0.0, 1.0), 1.30);
  float hgt   = uBladeHeight * rel
                             * (0.60 + 0.86 * clump)
                             * (0.74 + 0.40 * mound)
                             * (0.80 + 0.36 * det.b) * fade;
  float halfW = uBladeWidth * uWidthMul * (0.68 + 0.64 * h1.y);

  /* A few blades in every hundred stand taller and finer than the rest,
     so the top of the canopy breaks into individual strokes rather than
     a mown edge. Kept modest - overdone, they read as bamboo. */
  float stalk = smoothstep(0.955, 0.995, h0.z);
  hgt   *= 1.0 + 0.30 * stalk;
  halfW *= 1.0 + 0.22 * stalk;
  float roll  = h1.z * TAU;
  float phase = h1.w * TAU;
  float stiff = 0.60 + 0.65 * h0.z;

  /* ---- which way it lies ------------------------------------------
     Coarse comb from the swathe field, plus a per-tuft turn: in the
     photograph each tussock is combed its own way inside the broader
     sweep, and without the second term the whole field brushes as one.
     Then a little per-blade disagreement on top, because grass that all
     leans identically reads as carpet pile. */
  float combAng = atan(uWind.y, uWind.x)
                + (f.b - 0.5) * 1.55 + (det.g - 0.5) * 1.15;
  vec2 comb = vec2(cos(combAng), sin(combAng));
  vec2 jit  = vec2(cos(h1.z * TAU), sin(h1.z * TAU));
  /* Pulled toward the wind, but not all the way: grass that all points
     downwind reads as carpet pile, and the photograph plainly does not. */
  vec2 lean2 = normalize(mix(normalize(mix(comb, uWind, 0.22 + 0.26 * uWindStrength)),
                             jit, 0.26) + vec2(1e-5, 0.0));

  /* ---- how far it bends -------------------------------------------
     Two travelling noise fields scrolled along the wind vector give the
     long waves that roll across a field, plus a finer ripple on top;
     a per-blade sine adds the individual nodding. */
  vec2 sc = uWind * uWindTime;
  float g1 = fieldR(base - sc * 2.6, 1.0);
  float g2 = fieldR(base - sc * 6.2, 0.26);
  float sway = sin(uWindTime * 2.4 / stiff + phase + dot(base, uWind) * 0.85);

  /* How far a patch is permanently laid over. This is the single thing
     that gives the photograph its banding: grass pressed flat turns its
     blades face-up to the sky and goes pale, grass still standing is
     edge-on and reads almost black. Making it a broad spatial field
     rather than per-blade noise is what produces swathes. */
  float lay = fieldR(base, 2.6);

  float gustAmp = uWindStrength * (0.42 + 0.80 * g1);
  float bend = uBaseBend * (0.42 + 0.46 * clump + 0.62 * lay)
             + gustAmp * (0.62 + 0.34 * (g2 - 0.5) * 2.0 + 0.24 * sway);
  bend *= 0.72 + 0.48 * h1.x;

  /* ---- the player pushes through ----------------------------------
     Blades are shoved away radially AND carried along the direction of
     travel, so moving through the field opens a wake in front of you
     rather than a symmetrical bubble around you. The reach and the force
     both grow with speed: walking parts the grass, running flattens it. */
  vec2 toP = base - uPlayerXZ;
  float dp = length(toP) + 1e-4;
  vec2 outward = toP / dp;
  float reach = uPartRadius * (1.0 + 0.85 * uPlayerSpeed);
  /* elongate the affected patch along the direction of travel */
  float along = dot(outward, uPlayerVel);
  float shaped = dp * (1.0 - 0.30 * uPlayerSpeed * along);
  float push = smoothstep(reach, reach * 0.12, shaped)
             * uPartStrength * (0.55 + 0.75 * uPlayerSpeed);
  vec2 shove = normalize(outward + uPlayerVel * (0.85 * uPlayerSpeed) + vec2(1e-5, 0.0));
  /* the shove can cancel the lean exactly; keep it off zero */
  lean2 = normalize(lean2 + shove * push * 3.4 + vec2(1.0e-6, 0.0));
  bend += push * 1.15;

  /* ---- and leaves a trail ----------------------------------------- */
  float tr = trampleAt(base);
  bend += tr * 1.05;
  hgt  *= 1.0 - tr * 0.22;

  bend = clamp(bend * (1.0 - 0.35 * stalk), 0.015, 1.85);

  float gh = surfaceHeight(base);

  /* ---- circular-arc bend, length preserved exactly ---------------- */
  float t = aV.y;
  vec3 up = vec3(0.0, 1.0, 0.0);
  vec3 ld = vec3(lean2.x, 0.0, lean2.y);
  float s = t * bend;
  vec3 pos = (hgt / bend) * ((1.0 - cos(s)) * ld + sin(s) * up);
  vec3 tangent = normalize(sin(s) * ld + cos(s) * up);

  /* stable frame: sideBase is horizontal and never collapses, however
     far the blade lies over */
  vec3 sideBase = vec3(-ld.z, 0.0, ld.x);
  vec3 n0 = normalize(cross(sideBase, tangent));
  vec3 sideAxis = sideBase * cos(roll) + n0 * sin(roll);

  /* far rings turn edge-on blades toward the camera so they do not
     flicker out of existence at a kilometre */
  if (uViewFace > 0.001){
    vec3 toEye = normalize(uCam - (vec3(base.x, gh, base.y) + pos));
    vec3 billboard = cross(tangent, toEye);
    float bl = length(billboard);
    if (bl > 1e-3) {
      vec3 mixed = mix(sideAxis, billboard / bl, uViewFace);
      float ml = length(mixed);
      if (ml > 1.0e-4) sideAxis = mixed / ml;
    }
  }
  vec3 faceN = normalize(cross(sideAxis, tangent));

  float w = halfW * pow(max(1.0 - t, 0.0), 0.45) * (1.0 - 0.32 * t);

  /* high-frequency flutter, strongest at the tip */
  float flut = sin(uWindTime * 6.1 / stiff + phase * 3.1 + base.x * 2.3)
             * 0.016 * t * t * gustAmp;

  vec3 local = pos + sideAxis * (aV.x * w + flut);
  vWorld = vec3(base.x, gh, base.y) + local;

  /* the cross-section of a blade is a shallow trough, not a plane */
  vNormal = normalize(faceN + sideAxis * (aV.x * uCurve));
  vT = t;
  /* tufts catch the light together - weighting the clump field over
     the per-blade hash is what produces the pale streaks that run
     across the photograph, instead of even salt-and-pepper */
  /* Laid-over patches are the pale ones, so the colour variation has to
     follow the same field as the bend, not an independent hash. */
  vColVar = clamp(h1.y * 0.18 + clump * 0.26 + lay * 0.30 + mound * 0.26, 0.0, 1.0);
  vDist = length(uCam - vWorld);
  /* Almost NO sky reaches the bottom of a real canopy. The photograph's
     hollows are essentially black, and a gentle root-to-tip ramp cannot
     produce that - the falloff has to be steep and it has to bottom out
     near zero, or the whole field turns into flat grey felt. */
  float ao = mix(0.025, 1.0, pow(t, 1.95)) * mix(0.66, 1.0, 1.0 - clump * 0.55);
  /* A blade shorter than its neighbours is buried inside the canopy and
     sees almost no sky, however near its own tip you are. Without this
     every blade at a given height is lit identically and the field has
     no hollows in it at all - just even fur. */
  ao *= mix(0.32, 1.0, smoothstep(0.42, 1.05, rel));
  /* down in the hollow between tussocks little sky reaches the roots */
  ao *= mix(0.46, 1.0, smoothstep(0.05, 0.85, mound));
  /* Close up you see down into the canopy, where it is nearly black. At
     fifty metres you only resolve the tops, and the dark interior is
     hidden behind them - so the same occlusion term has to relax with
     distance or the far field comes out far too dark. */
  vAO = mix(ao, mix(ao, 1.0, 0.72), smoothstep(7.0, 55.0, dist));

  gl_Position = uViewProj * vec4(vWorld, 1.0);
}`;

const GRASS_FS = CHUNK.head + CHUNK.common + `
in vec3 vWorld;
in vec3 vNormal;
in float vT;
in float vColVar;
in float vDist;
in float vAO;
out vec4 oColor;

uniform vec3 uCam;
uniform vec3 uGrassDark;
uniform vec3 uGrassLight;
uniform vec3 uCoreDir;
uniform vec3 uCoreColour;
uniform float uSpecular;
uniform float uSheen;
uniform float uTranslucency;
uniform float uBackLight;
uniform float uGroundGain;

void main(){
  vec3 N = normalize(vNormal);
  if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(uCam - vWorld);
  vec3 D = -V;

  vec3 albedo = mix(uGrassDark, uGrassLight, vColVar);
  albedo *= mix(0.38, 1.22, vT);          /* dark at the root, pale at the tip */

  vec3 amb = shIrradiance(N) * (1.0 / PI) * vAO;

  /* light passing through the leaf from behind - the thing that makes a
     field read as grass rather than as green plastic */
  float t01 = clamp(vT, 0.0, 1.0);      /* an interpolated varying can overshoot */
  vec3 trans = shIrradiance(-N) * (1.0 / PI) * uTranslucency * pow(t01, 1.3) * vAO;

  /* and the airglow band directly behind the blade, catching its edge */
  /* A squared edge term lights an edge-on blade evenly down its whole
     length and the field fills with bright scratches. Cubed, only the
     blades genuinely presenting an edge catch it. */
  vec3 behind = normalize(vec3(D.x, 0.06, D.z));
  /* N and V are both unit, but the dot product still rounds to a hair
     over 1, and pow() of a negative base is NaN - which the bloom chain
     then smears into a black rectangle. This was the black squares. */
  float edge = pow(max(1.0 - abs(dot(N, V)), 0.0), 3.0);
  vec3 rim = skyPlate(behind) * edge * uBackLight * pow(t01, 1.15) * vAO;

  vec3 sheen = skySheen(N, V, uSheen) * mix(0.12, 1.0, vAO);
  vec3 spec = uCoreColour * ggx(N, V, uCoreDir, 0.42)
            * max(dot(N, uCoreDir), 0.0) * uSpecular;

  vec3 col = albedo * (amb + trans) * uGroundGain + albedo * rim + sheen + spec;

  col = mix(col, hazeColour(D), hazeAmount(vDist));
  oColor = vec4(col, 1.0);
}`;

/* ------------------------------------------------------------------ */

/* Never hand a driver more than this many instances in one draw. */
const INSTANCE_CHUNK = 65536;

class GrassRing {
  constructor(cfg) { Object.assign(this, cfg); }
}

class Grass {
  constructor(glw) {
    this.glw = glw;
    const gl = glw.gl;
    this.prog = glw.program(GRASS_VS, GRASS_FS, 'grass');

    /* one blade mesh per segment count, shared by the rings that use it */
    this.meshes = new Map();

    /* r0..r1 metres, cell size, segments, blade width multiplier,
       how much the blade turns to face you, and cross-section curl. */
    this.rings = [
      new GrassRing({ name: 'near', r0: 0.0,  r1: 6.5,   cell: 0.048, seg: 5, width: 1.00, viewFace: 0.00, curve: 0.75, seed: 11.0 }),
      new GrassRing({ name: 'mid',  r0: 5.6,  r1: 22.0,  cell: 0.100, seg: 3, width: 1.75, viewFace: 0.30, curve: 0.60, seed: 137.0 }),
      new GrassRing({ name: 'far',  r0: 21.0, r1: 65.0,  cell: 0.245, seg: 2, width: 3.60, viewFace: 0.72, curve: 0.40, seed: 613.0 }),
      /* Past this the haze has taken over and single blades are smaller
         than a pixel, so the ground mat carries it to the skyline - which
         is what the photograph does too: its horizon is a clean line. */
      new GrassRing({ name: 'edge', r0: 63.0, r1: 130.0, cell: 0.640, seg: 1, width: 8.00, viewFace: 1.00, curve: 0.20, seed: 2711.0 })
    ];
    for (const r of this.rings) {
      r.mesh = this.mesh(r.seg);
      r.fadeIn = r.r0 <= 0.001 ? [-1, -0.5] : [r.r0, r.r0 + (r.r1 - r.r0) * 0.16];
      r.fadeOut = [r.r1 - (r.r1 - r.r0) * 0.20, r.r1];
    }
  }

  mesh(seg) {
    if (this.meshes.has(seg)) return this.meshes.get(seg);
    const gl = this.glw.gl;
    const v = [];
    for (let i = 0; i < seg; i++) { const t = i / seg; v.push(-1, t, 1, t); }
    v.push(0, 1);                                     /* the tip */
    const idx = [];
    for (let i = 0; i < seg - 1; i++) {
      const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
      idx.push(a, b, c, b, d, c);
    }
    idx.push((seg - 1) * 2, (seg - 1) * 2 + 1, seg * 2);

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    this.glw.buffer(gl.ARRAY_BUFFER, new Float32Array(v));
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.glw.buffer(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx));
    gl.bindVertexArray(null);
    const m = { vao, count: idx.length };
    this.meshes.set(seg, m);
    return m;
  }

  /** Blades actually submitted this frame - the readout shows it. */
  get instanceCount() { return this._count | 0; }

  /**
   * The lattice covering what can actually be seen, in whole world cells.
   *
   * The grid used to be a square centred on the camera, of which the view
   * frustum only ever covers about a third - the rest was submitted purely
   * to be thrown away by the cull in the vertex shader, still paying a
   * vertex invocation per blade per vertex. Fitting the box to the visible
   * sector is free and cuts what is submitted by roughly two thirds.
   *
   * Returned in cell coordinates, so a blade's identity comes from where
   * it sits in the world rather than from where it happened to land in
   * this frame's grid, and it does not shuffle as you turn.
   */
  visibleBox(env, r1, cell) {
    const cx = env.camPos[0], cz = env.camPos[2];
    /* the same half-angle the vertex shader culls to, plus a margin */
    const half = Math.min(Math.acos(clamp(env.cullDot, -1, 1)) + 0.12, Math.PI);
    const yaw = Math.atan2(env.fwdXZ[0], -env.fwdXZ[1]);

    /* blades inside the near guard are never frustum-culled, because when
       you look straight down they are all around you */
    const near = Math.min(r1, 4.5);
    let minX = cx - near, maxX = cx + near;
    let minZ = cz - near, maxZ = cz + near;

    if (half < Math.PI - 1e-3) {
      const N = 14;
      for (let i = 0; i <= N; i++) {
        const a = yaw - half + (2 * half) * (i / N);
        const x = cx + Math.sin(a) * r1, z = cz - Math.cos(a) * r1;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (z < minZ) minZ = z;
        if (z > maxZ) maxZ = z;
      }
    } else {
      minX = cx - r1; maxX = cx + r1; minZ = cz - r1; maxZ = cz + r1;
    }

    const x0 = Math.floor(minX / cell), z0 = Math.floor(minZ / cell);
    return {
      x0, z0,
      w: Math.max(1, Math.ceil(maxX / cell) - x0 + 1),
      h: Math.max(1, Math.ceil(maxZ / cell) - z0 + 1)
    };
  }

  draw(env) {
    const gl = this.glw.gl, p = this.prog;
    gl.useProgram(p);
    env.bindCommon(p);

    gl.uniformMatrix4fv(p.u.uViewProj, false, env.viewProj);
    gl.uniform3fv(p.u.uCam, env.camPos);
    gl.uniform2fv(p.u.uFwdXZ, env.fwdXZ);
    gl.uniform1f(p.u.uCullDot, env.cullDot);
    gl.uniform1f(p.u.uBladeHeight, env.bladeHeight);
    gl.uniform1f(p.u.uBladeWidth, env.bladeWidth);
    gl.uniform2fv(p.u.uWind, env.windDir);
    gl.uniform1f(p.u.uWindStrength, env.windStrength);
    gl.uniform1f(p.u.uWindTime, env.windTime);
    gl.uniform1f(p.u.uBaseBend, env.baseBend);
    gl.uniform2fv(p.u.uPlayerXZ, env.playerXZ);
    gl.uniform2fv(p.u.uPlayerVel, env.playerHeading);
    gl.uniform1f(p.u.uPlayerSpeed, env.playerSpeed);
    gl.uniform1f(p.u.uPartRadius, env.partRadius);
    gl.uniform1f(p.u.uPartStrength, env.partStrength);
    gl.uniform3fv(p.u.uGrassDark, env.grassDark);
    gl.uniform3fv(p.u.uGrassLight, env.grassLight);
    gl.uniform3fv(p.u.uCoreDir, env.coreDir);
    gl.uniform3fv(p.u.uCoreColour, env.coreColour);
    gl.uniform1f(p.u.uSpecular, env.specular);
    gl.uniform1f(p.u.uSheen, env.sheen);
    gl.uniform1f(p.u.uTranslucency, env.translucency);
    gl.uniform1f(p.u.uBackLight, env.backLight);
    gl.uniform1f(p.u.uGroundGain, env.groundGain);

    gl.enable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);        /* blades are visible from both sides */

    let total = 0;
    /* Density widens the lattice instead of discarding instances in the
       vertex shader. Thinning by hash still pays the full vertex cost for
       every blade it throws away, which is exactly backwards on the
       hardware that needs the setting. Quantised so that a small change
       in the auto-quality scaler does not reshuffle the whole field. */
    const dens = Math.max(0.06, Math.round(env.density * 10) / 10);

    /* Plan every ring first, then hold the whole frame to a budget.
       A tile-based GPU bins primitives into a fixed buffer before it
       shades anything, and when that buffer overflows the driver drops
       geometry rather than reporting an error - the frame rate stays at
       60 and the grass simply is not there. Nothing in WebGL exposes
       where that limit is, so the only safe move is not to approach it,
       and to make the ceiling adjustable so it can be found. */
    const plan = [];
    let want = 0;
    for (const r of this.rings) {
      if (r.r0 > env.grassRange) continue;
      const r1 = Math.min(r.r1, env.grassRange);
      const cell = r.cell / Math.sqrt(dens);
      const box = this.visibleBox(env, r1, cell);
      plan.push({ r, r1, cell, box, coarsen: 1 });
      want += box.w * box.h;
    }
    if (want > env.bladeBudget) {
      /* coarsen every ring together so the field thins evenly */
      const k = Math.sqrt(want / env.bladeBudget);
      for (const q of plan) {
        q.cell *= k;
        q.coarsen = k;
        q.box = this.visibleBox(env, q.r1, q.cell);
      }
    }

    for (const q of plan) {
      const r = q.r, r1 = q.r1, cell = q.cell, box = q.box;
      /* fewer blades, each a little broader, so thinning the field costs
         coverage far more slowly than it costs vertices */
      const widen = clamp(1 + 0.4 * (1 / Math.sqrt(dens) - 1), 1, 2.1)
                  * clamp(1 + 0.55 * (q.coarsen - 1), 1, 2.6);

      gl.uniform1f(p.u.uCell, cell);
      gl.uniform2f(p.u.uOriginCell, box.x0, box.z0);
      gl.uniform1i(p.u.uGridW, box.w);
      gl.uniform1i(p.u.uGridH, box.h);
      gl.uniform2f(p.u.uRange, r.r0, r1);
      gl.uniform2f(p.u.uFadeIn, r.fadeIn[0], r.fadeIn[1]);
      gl.uniform2f(p.u.uFadeOut,
        Math.min(r.fadeOut[0], r1 - Math.max(1, r1 * 0.06)),
        r1);
      gl.uniform1f(p.u.uSeed, r.seed);
      gl.uniform1f(p.u.uWidthMul, r.width * widen);
      gl.uniform1f(p.u.uViewFace, r.viewFace);
      gl.uniform1f(p.u.uCurve, r.curve);

      /* Chunked. A single draw of a million instances is more than some
         drivers will take in one piece: a tile-based GPU can overflow the
         buffer it bins primitives into and silently drop geometry, and
         ANGLE splits oversized instanced draws itself, which has not
         always got gl_InstanceID right across the split. Splitting it
         here, with an explicit base, keeps it predictable. */
      const n = box.w * box.h;
      gl.bindVertexArray(r.mesh.vao);
      for (let base = 0; base < n; base += INSTANCE_CHUNK) {
        gl.uniform1i(p.u.uInstanceBase, base);
        gl.drawElementsInstanced(gl.TRIANGLES, r.mesh.count, gl.UNSIGNED_SHORT, 0,
                                 Math.min(INSTANCE_CHUNK, n - base));
      }
      total += n;
    }
    gl.bindVertexArray(null);
    this._count = total;
  }
}


/* ---- 70-trample.js --------------------------------------------- */
/* ===================================================================
   Trample map.

   A small decaying height field that follows the player. Where you walk,
   the grass goes down and stays down for a while, so you can look back
   and see the line you took through the field. It is a 512 square window
   56 m across, snapped to whole texels, ping-ponged each frame.
   =================================================================== */

const TRAMPLE_FS = CHUNK.head + `
in vec2 vUv;
out vec4 oColor;
uniform sampler2D uPrev;
uniform vec3 uPrevWin;
uniform vec3 uCurWin;
uniform vec2 uPlayer;
uniform vec2 uPrevPlayer;
uniform float uRadius;
uniform float uDecay;

/* distance from a point to the segment the player covered this frame,
   so fast movement still lays a continuous track */
float segDist(vec2 p, vec2 a, vec2 b){
  vec2 ab = b - a;
  float l2 = dot(ab, ab);
  float t = l2 > 1e-6 ? clamp(dot(p - a, ab) / l2, 0.0, 1.0) : 0.0;
  return length(p - (a + ab * t));
}

void main(){
  vec2 world = uCurWin.xy + vUv * uCurWin.z;

  float prev = 0.0;
  vec2 puv = (world - uPrevWin.xy) / uPrevWin.z;
  if (all(greaterThanEqual(puv, vec2(0.0))) && all(lessThanEqual(puv, vec2(1.0))))
    prev = texture(uPrev, puv).r;
  prev *= uDecay;

  float d = segDist(world, uPrevPlayer, uPlayer);
  float stamp = smoothstep(uRadius, uRadius * 0.3, d);

  oColor = vec4(max(prev, stamp), 0.0, 0.0, 1.0);
}`;

class Trample {
  constructor(glw, res, span) {
    this.glw = glw;
    const gl = glw.gl;
    this.res = res;
    this.span = span;
    this.texel = span / res;
    this.prog = glw.program(FULLSCREEN_VS, TRAMPLE_FS, 'trample');
    const mk = () => glw.target(res, res, { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE });
    this.a = mk();
    this.b = mk();
    for (const t of [this.a, this.b]) {
      glw.bindTarget(t);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
    glw.bindTarget(null);
    this.win = [0, 0, span];
    this.prevWin = [0, 0, span];
    this.prevPlayer = [0, 0];
    this.first = true;
  }

  get texture() { return this.a.tex; }
  get window() { return this.win; }

  update(px, pz, dt, radius, recoverSeconds) {
    const gl = this.glw.gl, p = this.prog;
    this.prevWin = this.win.slice();
    /* snap to whole texels: an unsnapped scroll would resample the map
       every frame and smear the track into mush within seconds */
    const ox = Math.round((px - this.span * 0.5) / this.texel) * this.texel;
    const oz = Math.round((pz - this.span * 0.5) / this.texel) * this.texel;
    this.win = [ox, oz, this.span];

    const dst = this.b;
    this.glw.bindTarget(dst);
    gl.useProgram(p);
    gl.disable(gl.DEPTH_TEST);
    this.glw.bindTex(0, this.a.tex);
    gl.uniform1i(p.u.uPrev, 0);
    gl.uniform3fv(p.u.uPrevWin, this.prevWin);
    gl.uniform3fv(p.u.uCurWin, this.win);
    gl.uniform2f(p.u.uPlayer, px, pz);
    const pp = this.first ? [px, pz] : this.prevPlayer;
    gl.uniform2f(p.u.uPrevPlayer, pp[0], pp[1]);
    gl.uniform1f(p.u.uRadius, radius);
    gl.uniform1f(p.u.uDecay, Math.exp(-dt / Math.max(recoverSeconds, 0.1)));
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    this.b = this.a; this.a = dst;
    this.prevPlayer = [px, pz];
    this.first = false;
    this.glw.bindTarget(null);
    gl.enable(gl.DEPTH_TEST);
  }

  clear() {
    const gl = this.glw.gl;
    for (const t of [this.a, this.b]) {
      this.glw.bindTarget(t);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
    this.glw.bindTarget(null);
    this.first = true;
  }
}


/* ---- 75-post.js ------------------------------------------------ */
/* ===================================================================
   Post.

   The photograph is a long exposure taken on a real lens: the core of
   the galaxy blooms, the shadows are full of sensor grain, the corners
   fall off. A clean render of the same scene looks wrong precisely
   because it is clean, so all of that goes back on here.
   =================================================================== */

const BLOOM_PREFILTER_FS = CHUNK.head + CHUNK.common + `
in vec2 vUv; out vec4 oColor;
uniform sampler2D uTex;
uniform float uThreshold, uKnee, uExposure;
void main(){
  vec3 c = sanitise(texture(uTex, vUv).rgb) * uExposure;
  float br = max(c.r, max(c.g, c.b));
  float soft = clamp(br - uThreshold + uKnee, 0.0, 2.0 * uKnee);
  soft = soft * soft / (4.0 * uKnee + 1e-4);
  float w = max(soft, br - uThreshold) / max(br, 1e-4);
  oColor = vec4(c * w, 1.0);
}`;

/* Jimenez's 13-tap downsample: no pulsing fireflies as the chain shrinks. */
const BLOOM_DOWN_FS = CHUNK.head + `
in vec2 vUv; out vec4 oColor;
uniform sampler2D uTex;
uniform vec2 uTexel;
void main(){
  vec2 t = uTexel;
  vec3 a = texture(uTex, vUv + vec2(-2, 2) * t).rgb;
  vec3 b = texture(uTex, vUv + vec2( 0, 2) * t).rgb;
  vec3 c = texture(uTex, vUv + vec2( 2, 2) * t).rgb;
  vec3 d = texture(uTex, vUv + vec2(-2, 0) * t).rgb;
  vec3 e = texture(uTex, vUv                ).rgb;
  vec3 f = texture(uTex, vUv + vec2( 2, 0) * t).rgb;
  vec3 g = texture(uTex, vUv + vec2(-2,-2) * t).rgb;
  vec3 h = texture(uTex, vUv + vec2( 0,-2) * t).rgb;
  vec3 i = texture(uTex, vUv + vec2( 2,-2) * t).rgb;
  vec3 j = texture(uTex, vUv + vec2(-1, 1) * t).rgb;
  vec3 k = texture(uTex, vUv + vec2( 1, 1) * t).rgb;
  vec3 l = texture(uTex, vUv + vec2(-1,-1) * t).rgb;
  vec3 m = texture(uTex, vUv + vec2( 1,-1) * t).rgb;
  vec3 o = e * 0.125
         + (a + c + g + i) * 0.03125
         + (b + d + f + h) * 0.0625
         + (j + k + l + m) * 0.125;
  oColor = vec4(o, 1.0);
}`;

const BLOOM_UP_FS = CHUNK.head + `
in vec2 vUv; out vec4 oColor;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uRadius;
void main(){
  vec2 t = uTexel * uRadius;
  vec3 s = texture(uTex, vUv + vec2(-1, 1) * t).rgb * 1.0
         + texture(uTex, vUv + vec2( 0, 1) * t).rgb * 2.0
         + texture(uTex, vUv + vec2( 1, 1) * t).rgb * 1.0
         + texture(uTex, vUv + vec2(-1, 0) * t).rgb * 2.0
         + texture(uTex, vUv                ).rgb * 4.0
         + texture(uTex, vUv + vec2( 1, 0) * t).rgb * 2.0
         + texture(uTex, vUv + vec2(-1,-1) * t).rgb * 1.0
         + texture(uTex, vUv + vec2( 0,-1) * t).rgb * 2.0
         + texture(uTex, vUv + vec2( 1,-1) * t).rgb * 1.0;
  oColor = vec4(s * (1.0 / 16.0), 1.0);
}`;

const COMPOSITE_FS = CHUNK.head + CHUNK.common + CHUNK.tonemap + `
in vec2 vUv; out vec4 oColor;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2 uRes;
uniform float uExposure, uBloomAmt, uGrain, uVignette, uSat, uCA, uFrame;

void main(){
  vec2 uv = vUv;
  vec2 c = uv - 0.5;
  float r2 = dot(c, c);

  vec3 col;
  if (uCA > 0.0001){
    /* transverse chromatic aberration: a real wide lens splits colour
       toward the corners and almost nowhere in the middle */
    vec2 off = c * r2 * uCA;
    col = vec3(texture(uScene, uv + off).r,
               texture(uScene, uv).g,
               texture(uScene, uv - off).b);
  } else {
    col = texture(uScene, uv).rgb;
  }

  col = sanitise(col);
  col += sanitise(texture(uBloom, uv).rgb) * uBloomAmt;
  col *= uExposure;

  col = shoulder(col);
  col = saturate3(col, uSat);
  col *= 1.0 - uVignette * smoothstep(0.10, 0.60, r2);

  /* Grain lives in the shadows on a real high-ISO frame, and it is
     mostly luminance with a little colour speckle underneath. */
  if (uGrain > 0.0001){
    vec2 g = gl_FragCoord.xy;
    float n1 = hash11(dot(g, vec2(12.9898, 78.233)) + uFrame * 1.618) - 0.5;
    float n2 = hash11(dot(g, vec2(39.346, 11.135)) + uFrame * 2.718 + 91.0) - 0.5;
    float n3 = hash11(dot(g, vec2(63.712, 27.409)) + uFrame * 3.142 + 17.0) - 0.5;
    float amt = uGrain * mix(1.25, 0.40, smoothstep(0.010, 0.32, luma(col)));
    col += (vec3(n1) * 0.72 + vec3(n2, n3, -n2 - n3) * 0.28) * amt;
  }

  col = linearToSrgb(max(col, vec3(0.0)));

  /* a hair of ordered dither: without it a night sky in 8 bits bands */
  float d = fract(dot(gl_FragCoord.xy, vec2(0.7548776662, 0.5698402909)));
  col += (d - 0.5) / 255.0;

  oColor = vec4(col, 1.0);
}`;

class Post {
  constructor(glw) {
    this.glw = glw;
    this.pre = glw.program(FULLSCREEN_VS, BLOOM_PREFILTER_FS, 'bloom.pre');
    this.down = glw.program(FULLSCREEN_VS, BLOOM_DOWN_FS, 'bloom.down');
    this.up = glw.program(FULLSCREEN_VS, BLOOM_UP_FS, 'bloom.up');
    this.comp = glw.program(FULLSCREEN_VS, COMPOSITE_FS, 'composite');
    this.chain = [];
    this.frame = 0;
  }

  resize(w, h, levels) {
    for (const t of this.chain) t.free();
    this.chain = [];
    /* Start at a quarter, not a half. The bloom chain is a dozen
       full-screen render passes on a half-float target, and on a
       tile-based GPU each one flushes tile memory - it was costing four
       times the bandwidth it needed to for a glow this soft. */
    let cw = Math.max(1, w >> 2), ch = Math.max(1, h >> 2);
    for (let i = 0; i < levels && cw > 4 && ch > 4; i++) {
      this.chain.push(this.glw.target(cw, ch, {}));
      cw = Math.max(1, cw >> 1); ch = Math.max(1, ch >> 1);
    }
  }

  /** Bright pass, shrink, then blur back up accumulating every level. */
  bloom(sceneTex, exposure, threshold, knee, radius) {
    const gl = this.glw.gl;
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);

    let p = this.pre;
    gl.useProgram(p);
    this.glw.bindTarget(this.chain[0]);
    this.glw.bindTex(0, sceneTex);
    gl.uniform1i(p.u.uTex, 0);
    gl.uniform1f(p.u.uThreshold, threshold);
    gl.uniform1f(p.u.uKnee, knee);
    gl.uniform1f(p.u.uExposure, exposure);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    p = this.down;
    gl.useProgram(p);
    for (let i = 1; i < this.chain.length; i++) {
      const src = this.chain[i - 1], dst = this.chain[i];
      this.glw.bindTarget(dst);
      this.glw.bindTex(0, src.tex);
      gl.uniform1i(p.u.uTex, 0);
      gl.uniform2f(p.u.uTexel, 1 / src.w, 1 / src.h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    p = this.up;
    gl.useProgram(p);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    for (let i = this.chain.length - 1; i > 0; i--) {
      const src = this.chain[i], dst = this.chain[i - 1];
      this.glw.bindTarget(dst);
      this.glw.bindTex(0, src.tex);
      gl.uniform1i(p.u.uTex, 0);
      gl.uniform2f(p.u.uTexel, 1 / src.w, 1 / src.h);
      gl.uniform1f(p.u.uRadius, radius);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.disable(gl.BLEND);
    return this.chain[0].tex;
  }

  composite(sceneTex, bloomTex, o) {
    const gl = this.glw.gl, p = this.comp;
    this.glw.bindTarget(null);
    gl.useProgram(p);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    this.glw.bindTex(0, sceneTex); gl.uniform1i(p.u.uScene, 0);
    this.glw.bindTex(1, bloomTex); gl.uniform1i(p.u.uBloom, 1);
    gl.uniform2f(p.u.uRes, this.glw.canvas.width, this.glw.canvas.height);
    gl.uniform1f(p.u.uExposure, o.exposure);
    gl.uniform1f(p.u.uBloomAmt, o.bloom);
    gl.uniform1f(p.u.uGrain, o.grain);
