    gl.uniform1f(p.u.uVignette, o.vignette);
    gl.uniform1f(p.u.uSat, o.saturation);
    gl.uniform1f(p.u.uCA, o.chroma);
    gl.uniform1f(p.u.uFrame, (this.frame++ % 4096));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
}


/* ---- 78-fireflies.js ------------------------------------------- */
/* ===================================================================
   Fireflies. Off by default - the photograph has none, and the brief
   was to match the photograph. Turn them up in Settings if you want
   the field to feel inhabited; the bloom pass treats them as real
   light sources, so they smear properly through the grass.
   =================================================================== */

const FLY_VS = CHUNK.head + CHUNK.common + `
uniform mat4 uViewProj;
uniform vec3 uCam;
uniform float uBox;
uniform float uPointScale;
out float vGlow;
out vec3 vWorld;

void main(){
  float id = float(gl_VertexID);
  vec3 h  = hash31(id * 1.7 + 3.1);
  vec3 h2 = hash31(id * 2.3 + 91.7);

  vec2 xz = h.xy * uBox;
  xz += vec2(sin(uTime * 0.31 + h2.x * TAU), cos(uTime * 0.27 + h2.y * TAU)) * 1.8;
  xz += uWind * uTime * 0.35;

  /* keep the swarm around the camera by wrapping it into a moving box */
  vec2 corner = uCam.xz - uBox * 0.5;
  xz = mod(xz - corner, uBox) + corner;

  float y = surfaceHeight(xz) + 0.12 + h2.z * 1.15
          + sin(uTime * 0.9 + h.z * TAU) * 0.22;
  vWorld = vec3(xz.x, y, xz.y);

  float blink = pow(max(sin(uTime * (0.7 + h.z * 0.9) + h2.x * TAU), 0.0), 9.0);
  vGlow = blink;

  vec4 clip = uViewProj * vec4(vWorld, 1.0);
  float dist = length(uCam - vWorld);
  gl_PointSize = clamp(uPointScale / max(dist, 0.4), 1.5, 40.0);
  gl_Position = clip;
}`;

const FLY_FS = CHUNK.head + CHUNK.common + `
in float vGlow;
in vec3 vWorld;
out vec4 oColor;
uniform vec3 uCam;
uniform vec3 uTint;
uniform float uIntensity;
void main(){
  vec2 d = gl_PointCoord - 0.5;
  float r = length(d) * 2.0;
  if (r > 1.0) discard;
  float core = exp(-r * r * 5.0);
  float dist = length(uCam - vWorld);
  float fog = 1.0 - hazeAmount(dist);
  oColor = vec4(uTint * core * vGlow * uIntensity * fog, 1.0);
}`;

class Fireflies {
  constructor(glw, max) {
    this.glw = glw;
    this.max = max;
    this.prog = glw.program(FLY_VS, FLY_FS, 'fireflies');
    this.vao = glw.gl.createVertexArray();
  }

  draw(env, amount) {
    if (amount <= 0.001) return;
    const gl = this.glw.gl, p = this.prog;
    const n = Math.round(this.max * amount);
    if (n < 1) return;
    gl.useProgram(p);
    env.bindCommon(p);
    gl.uniformMatrix4fv(p.u.uViewProj, false, env.viewProj);
    gl.uniform3fv(p.u.uCam, env.camPos);
    gl.uniform2fv(p.u.uWind, env.windDir);
    gl.uniform1f(p.u.uBox, 70.0);
    gl.uniform1f(p.u.uPointScale, 26.0 * (this.glw.canvas.height / 1080));
    gl.uniform3f(p.u.uTint, 1.0, 0.86, 0.42);
    gl.uniform1f(p.u.uIntensity, 0.5);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.depthMask(false);
    gl.bindVertexArray(this.vao);
    gl.drawArrays(gl.POINTS, 0, n);
    gl.bindVertexArray(null);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }
}


/* ---- 80-audio.js ----------------------------------------------- */
/* ===================================================================
   Sound, synthesised from noise - no audio files, nothing to download.

   Three voices: a low body of moving air, a bright hiss of grass that
   rises with the gusts and with how fast you are pushing through it,
   and a footstep swish fired off the walk cycle.
   =================================================================== */

class Ambience {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this.enabled = false;
    this.volume = 0.55;
  }

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    this.ctx = ctx;

    /* one second of pink-ish noise, looped */
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + w * 0.0990460;
      b1 = 0.96300 * b1 + w * 0.2965164;
      b2 = 0.57000 * b2 + w * 1.0526913;
      d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.16;
    }
    /* crossfade the tail into the head so the loop has no click */
    const xf = Math.floor(ctx.sampleRate * 0.25);
    for (let i = 0; i < xf; i++) {
      const t = i / xf;
      d[i] = d[i] * t + d[len - xf + i] * (1 - t);
    }
    this.noise = buf;

    this.master = ctx.createGain();
    this.master.gain.value = 0;
    this.master.connect(ctx.destination);

    const src = () => {
      const s = ctx.createBufferSource();
      s.buffer = buf; s.loop = true; s.start();
      return s;
    };

    /* body of the wind */
    this.lowSrc = src();
    this.lowFilt = ctx.createBiquadFilter();
    this.lowFilt.type = 'lowpass';
    this.lowFilt.frequency.value = 320;
    this.lowFilt.Q.value = 0.7;
    this.lowGain = ctx.createGain(); this.lowGain.gain.value = 0.5;
    this.lowSrc.connect(this.lowFilt).connect(this.lowGain).connect(this.master);

    /* grass hiss */
    this.hiSrc = src();
    this.hiFilt = ctx.createBiquadFilter();
    this.hiFilt.type = 'bandpass';
    this.hiFilt.frequency.value = 2600;
    this.hiFilt.Q.value = 0.55;
    this.hiGain = ctx.createGain(); this.hiGain.gain.value = 0.0;
    this.hiSrc.connect(this.hiFilt).connect(this.hiGain).connect(this.master);

    this.ready = true;
  }

  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }

  setEnabled(on) {
    this.enabled = on;
    if (on) { this.init(); this.resume(); }
    if (this.ready) {
      this.master.gain.setTargetAtTime(on ? this.volume : 0, this.ctx.currentTime, 0.4);
    }
  }

  setVolume(v) {
    this.volume = v;
    if (this.ready && this.enabled)
      this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.1);
  }

  /** gust 0..1, speed in m/s, strength = the wind setting */
  update(gust, speed, strength) {
    if (!this.ready || !this.enabled) return;
    const t = this.ctx.currentTime;
    const g = Math.min(1, gust * strength);
    this.lowFilt.frequency.setTargetAtTime(220 + g * 420, t, 0.25);
    this.lowGain.gain.setTargetAtTime(0.22 + g * 0.62, t, 0.3);
    this.hiFilt.frequency.setTargetAtTime(1900 + g * 2400, t, 0.25);
    this.hiGain.gain.setTargetAtTime(0.03 + g * 0.16 + Math.min(speed, 6) * 0.030, t, 0.18);
  }

  footstep(power) {
    if (!this.ready || !this.enabled) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const s = ctx.createBufferSource();
    s.buffer = this.noise;
    s.playbackRate.value = 0.85 + Math.random() * 0.4;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 1500 + Math.random() * 1600;
    f.Q.value = 0.8;
    const g = ctx.createGain();
    const peak = 0.16 * power;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16 + Math.random() * 0.08);
    s.connect(f).connect(g).connect(this.master);
    s.start(t, Math.random() * 1.5);
    s.stop(t + 0.3);
  }
}


/* ---- 85-input.js ----------------------------------------------- */
/* ===================================================================
   Input: pointer-lock mouse, keyboard, a thumb stick on touch, and a
   gamepad if one is plugged in.
   =================================================================== */

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = Object.create(null);
    this.dx = 0; this.dy = 0;
    this.locked = false;
    /* Pointer lock is not granted inside a sandboxed frame, which is how
       the hosted page is served - so mouse look silently did nothing
       there. Drag-look is the fallback that works everywhere. */
    this.lockAvailable = true;
    this.dragging = false;
    this.lastX = 0;
    this.lastY = 0;
    this.sensitivity = 1.0;
    this.invertY = false;
    this.touch = { active: false, id: -1, ox: 0, oy: 0, x: 0, y: 0 };
    this.lookTouch = { id: -1, x: 0, y: 0 };
    this.onLockChange = null;
    this.stickEl = null;
    this._bind();
  }

  _bind() {
    const c = this.canvas;

    addEventListener('keydown', (e) => {
      if (e.code === 'Tab') e.preventDefault();
      this.keys[e.code] = true;
      if (this.onKey) this.onKey(e);
    });
    addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    addEventListener('blur', () => { this.keys = Object.create(null); });

    document.addEventListener('pointerlockchange', () => {
      this.locked = document.pointerLockElement === c;
      if (this.onLockChange) this.onLockChange(this.locked);
    });

    addEventListener('mousemove', (e) => {
      if (this.locked) {
        /* Chrome can deliver one enormous movement value on lock; clamping
           stops the view snapping halfway round the field. */
        const mx = Math.max(-260, Math.min(260, e.movementX || 0));
        const my = Math.max(-260, Math.min(260, e.movementY || 0));
        this.dx += mx * 0.0022 * this.sensitivity;
        this.dy += my * 0.0022 * this.sensitivity * (this.invertY ? -1 : 1);
        return;
      }
      if (!this.dragging) return;
      const dx = e.clientX - this.lastX, dy = e.clientY - this.lastY;
      this.lastX = e.clientX; this.lastY = e.clientY;
      this.dx += dx * 0.0034 * this.sensitivity;
      this.dy += dy * 0.0034 * this.sensitivity * (this.invertY ? -1 : 1);
    });

    c.addEventListener('mousedown', (e) => {
      if (this.locked || e.button !== 0) return;
      this.dragging = true;
      this.lastX = e.clientX; this.lastY = e.clientY;
      e.preventDefault();
    });
    addEventListener('mouseup', () => { this.dragging = false; });
    addEventListener('blur', () => { this.dragging = false; });
    c.addEventListener('contextmenu', (e) => e.preventDefault());

    document.addEventListener('pointerlockerror', () => {
      this.lockAvailable = false;
      if (this.onLockUnavailable) this.onLockUnavailable();
    });

    /* ---- touch: left half drives, right half looks ---- */
    const half = () => innerWidth * 0.5;
    c.addEventListener('touchstart', (e) => {
      for (const t of e.changedTouches) {
        if (t.clientX < half() && !this.touch.active) {
          this.touch = { active: true, id: t.identifier, ox: t.clientX, oy: t.clientY,
                         x: t.clientX, y: t.clientY };
          if (this.stickEl) {
            this.stickEl.style.left = (t.clientX - 59) + 'px';
            this.stickEl.style.top = (t.clientY - 59) + 'px';
            this.stickEl.style.opacity = '1';
          }
        } else if (this.lookTouch.id < 0) {
          this.lookTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
        }
      }
      e.preventDefault();
    }, { passive: false });

    c.addEventListener('touchmove', (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === this.touch.id) {
          this.touch.x = t.clientX; this.touch.y = t.clientY;
          if (this.stickEl) {
            const k = this.stickVector();
            this.stickEl.firstElementChild.style.transform =
              'translate(' + (k[0] * 34) + 'px,' + (k[1] * 34) + 'px)';
          }
        } else if (t.identifier === this.lookTouch.id) {
          this.dx += (t.clientX - this.lookTouch.x) * 0.006 * this.sensitivity;
          this.dy += (t.clientY - this.lookTouch.y) * 0.006 * this.sensitivity
                   * (this.invertY ? -1 : 1);
          this.lookTouch.x = t.clientX; this.lookTouch.y = t.clientY;
        }
      }
      e.preventDefault();
    }, { passive: false });

    const end = (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === this.touch.id) {
          this.touch.active = false; this.touch.id = -1;
          if (this.stickEl) {
            this.stickEl.style.opacity = '0';
            this.stickEl.firstElementChild.style.transform = '';
          }
        }
        if (t.identifier === this.lookTouch.id) this.lookTouch.id = -1;
      }
    };
    c.addEventListener('touchend', end);
    c.addEventListener('touchcancel', end);
  }

  stickVector() {
    if (!this.touch.active) return [0, 0];
    const dx = (this.touch.x - this.touch.ox) / 52;
    const dy = (this.touch.y - this.touch.oy) / 52;
    const m = Math.hypot(dx, dy);
    return m > 1 ? [dx / m, dy / m] : [dx, dy];
  }

  requestLock() {
    if (!this.canvas.requestPointerLock) { this.noteLockUnavailable(); return; }
    /* unadjustedMovement gives raw mouse deltas where it is supported;
       older browsers reject the options object outright, so both the
       throw and the rejected promise have to fall back */
    try {
      const p = this.canvas.requestPointerLock({ unadjustedMovement: true });
      if (p && p.catch) p.catch(() => { try { this.canvas.requestPointerLock(); } catch (e) {} });
    } catch (e) {
      try { this.canvas.requestPointerLock(); } catch (e2) {}
    }
    /* A sandboxed frame does not always fire pointerlockerror - it just
       never locks. If we are not locked shortly after asking, assume we
       never will be and switch to dragging. */
    clearTimeout(this._lockTimer);
    this._lockTimer = setTimeout(() => {
      if (!this.locked) this.noteLockUnavailable();
    }, 600);
  }

  noteLockUnavailable() {
    if (!this.lockAvailable) return;
    this.lockAvailable = false;
    if (this.onLockUnavailable) this.onLockUnavailable();
  }

  /** Movement in camera space: x right, y forward, both -1..1. */
  moveVector() {
    const k = this.keys;
    let x = 0, y = 0;
    if (k.KeyW || k.ArrowUp) y += 1;
    if (k.KeyS || k.ArrowDown) y -= 1;
    if (k.KeyD || k.ArrowRight) x += 1;
    if (k.KeyA || k.ArrowLeft) x -= 1;

    const s = this.stickVector();
    x += s[0]; y -= s[1];

    const gp = this.gamepad();
    if (gp) {
      const dz = (v) => Math.abs(v) < 0.16 ? 0 : v;
      x += dz(gp.axes[0]); y -= dz(gp.axes[1]);
      this.dx += dz(gp.axes[2] || 0) * 0.045 * this.sensitivity;
      this.dy += dz(gp.axes[3] || 0) * 0.045 * this.sensitivity * (this.invertY ? -1 : 1);
    }

    const m = Math.hypot(x, y);
    return m > 1 ? [x / m, y / m] : [x, y];
  }

  gamepad() {
    if (!navigator.getGamepads) return null;
    const list = navigator.getGamepads();
    for (const g of list) if (g && g.connected && g.axes.length >= 2) return g;
    return null;
  }

  running() {
    const gp = this.gamepad();
    return !!(this.keys.ShiftLeft || this.keys.ShiftRight ||
              (gp && gp.buttons[10] && gp.buttons[10].pressed));
  }
  crouching() { return !!this.keys.KeyC; }
  jumping() {
    const gp = this.gamepad();
    return !!(this.keys.Space || (gp && gp.buttons[0] && gp.buttons[0].pressed));
  }

  /** Consume the accumulated look delta. */
  takeLook() {
    const d = [this.dx, this.dy];
    this.dx = 0; this.dy = 0;
    return d;
  }
}


/* ---- 88-selftest.js -------------------------------------------- */
/* ===================================================================
   Startup self-test.

   Written because three rounds of diagnosis were spent guessing at a
   machine I cannot run on. Every one of these features is one the
   renderer silently depends on: if the driver quietly does the wrong
   thing, the symptom is a black or flickering field with no error, no
   exception and no clue. So rather than assume, render something with a
   known answer and read it back.

   Anything that fails is switched off rather than left to misbehave, and
   the result is printed by the Diagnostics button.
   =================================================================== */

const ST_FS_VALUE = CHUNK.head + `
in float vV; out vec4 o;
void main(){ o = vec4(clamp(vV, 0.0, 1.0), 0.0, 0.0, 1.0); }`;

const ST_VS_VTF = CHUNK.head + `
uniform sampler2D uTex;
uniform vec2 uUV;
out float vV;
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  /* the whole point: sample in the VERTEX stage, as the grass does */
  vV = textureLod(uTex, uUV, 0.0).r;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const ST_VS_CONST = CHUNK.head + `
uniform float uValue;
out float vV;
void main(){
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  vV = uValue;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const ST_FS_SAMPLE = CHUNK.head + `
in vec2 vUv; out vec4 o;
uniform sampler2D uTex;
void main(){ o = vec4(clamp(texture(uTex, vUv).r, 0.0, 1.0), 0.0, 0.0, 1.0); }`;

function runSelfTest(glw, heightTex, heightData, heightRes) {
  const gl = glw.gl;
  const R = { vertexTextureFetch: null, halfFloatTargets: null, msaaResolve: null, notes: [] };
  const made = [];
  const px = new Uint8Array(4 * 4 * 4);

  const readRed = () => {
    gl.readPixels(0, 0, 4, 4, gl.RGBA, gl.UNSIGNED_BYTE, px);
    return px[0];
  };

  try {
    const probe = glw.target(4, 4, { internal: gl.RGBA8, type: gl.UNSIGNED_BYTE, filter: gl.NEAREST });
    made.push(probe);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);

    /* ---- 1. vertex texture fetch ---------------------------------- */
    try {
      const prog = glw.program(ST_VS_VTF, ST_FS_VALUE, 'selftest.vtf');
      const tx = 137, ty = 241;
      const expect = Math.round(heightData[ty * heightRes + tx] * 255);
      glw.bindTarget(probe);
      gl.useProgram(prog);
      glw.bindTex(0, heightTex);
      gl.uniform1i(prog.u.uTex, 0);
      gl.uniform2f(prog.u.uUV, (tx + 0.5) / heightRes, (ty + 0.5) / heightRes);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      const got = readRed();
      R.vertexTextureFetch = Math.abs(got - expect) <= 4;
      if (!R.vertexTextureFetch) R.notes.push('vertex texture fetch read ' + got + ', expected ' + expect);
      gl.deleteProgram(prog);
    } catch (e) { R.vertexTextureFetch = false; R.notes.push('vtf: ' + e.message); }

    /* ---- 2. half-float render targets ------------------------------ */
    if (glw.hdr) {
      try {
        const hdrT = glw.target(4, 4, { filter: gl.NEAREST });
        made.push(hdrT);
        const pc = glw.program(ST_VS_CONST, ST_FS_VALUE, 'selftest.const');
        const ps = glw.program(FULLSCREEN_VS, ST_FS_SAMPLE, 'selftest.sample');
        glw.bindTarget(hdrT);
        gl.useProgram(pc);
        gl.uniform1f(pc.u.uValue, 0.5);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        glw.bindTarget(probe);
        gl.useProgram(ps);
        glw.bindTex(0, hdrT.tex);
        gl.uniform1i(ps.u.uTex, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        const got = readRed();
        R.halfFloatTargets = Math.abs(got - 128) <= 6;
        if (!R.halfFloatTargets) R.notes.push('half-float target read ' + got + ', expected 128');
        gl.deleteProgram(pc); gl.deleteProgram(ps);
      } catch (e) { R.halfFloatTargets = false; R.notes.push('hdr: ' + e.message); }
    } else {
      R.halfFloatTargets = false;
      R.notes.push('no float colour buffer extension; using 8-bit targets');
    }

    /* ---- 3. multisample resolve ------------------------------------ */
    try {
      const ms = glw.targetMS(4, 4, 4, { depth: true, filter: gl.NEAREST });
      made.push(ms);
      if (!ms.resolve) {
        R.msaaResolve = false;
        R.notes.push('no multisampled target available');
      } else {
        const pc = glw.program(ST_VS_CONST, ST_FS_VALUE, 'selftest.msconst');
        const ps = glw.program(FULLSCREEN_VS, ST_FS_SAMPLE, 'selftest.mssample');
        glw.bindTarget(ms, true);
        gl.useProgram(pc);
        gl.uniform1f(pc.u.uValue, 0.5);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        ms.resolve();
        glw.bindTarget(probe);
        gl.useProgram(ps);
        glw.bindTex(0, ms.tex);
        gl.uniform1i(ps.u.uTex, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        const got = readRed();
        R.msaaResolve = Math.abs(got - 128) <= 6;
        if (!R.msaaResolve) R.notes.push('msaa resolve read ' + got + ', expected 128');
        gl.deleteProgram(pc); gl.deleteProgram(ps);
      }
    } catch (e) { R.msaaResolve = false; R.notes.push('msaa: ' + e.message); }

    const err = gl.getError();
    if (err) R.notes.push('glGetError after self-test: ' + err);
  } catch (e) {
    R.notes.push('self-test could not run: ' + e.message);
  } finally {
    for (const t of made) { try { t.free(); } catch (e) {} }
    glw.bindTarget(null);
  }
  return R;
}


/* ---- 90-main.js ------------------------------------------------ */
/* ===================================================================
   The world, and the loop that runs it.
   =================================================================== */

/* Set after a context loss or an out-of-memory, and read on the next load
   so that a machine which has already fallen over once comes back gently
   instead of straight back into the thing that broke it. */
const SAFE_KEY = 'grassfield.saferestart';
const SAFE_MODE = (() => {
  try { return localStorage.getItem(SAFE_KEY) === '1'; } catch (e) { return false; }
})();
function markSafeRestart() { try { localStorage.setItem(SAFE_KEY, '1'); } catch (e) {} }
function clearSafeRestart() { try { localStorage.removeItem(SAFE_KEY); } catch (e) {} }

const DEFAULTS = {
  quality: 'auto',
  renderScale: 1.0,
  density: 1.0,
  grassRange: 130,
  bladeHeight: 1.45,
  wind: 0.70,
  /* how far the strength swings between lull and gust */
  gustiness: 0.75,
  /* how quickly gusts arrive and pass */
  gustRate: 1.0,
  /* how much the direction wanders as it gusts */
  windShift: 0.45,
  fov: 68,
  exposure: 1.00,
  bloom: 0.09,
  grain: 0.028,
  vignette: 0.42,
  saturation: 1.04,
  /* how far around you the grass is parted, and how hard */
  partRadius: 1.05,
  partStrength: 1.15,
  groundLift: 5.9,
  sheen: 1.45,
  chroma: 0.0035,
  stars: 1.0,
  fireflies: 0.0,
  sensitivity: 1.0,
  invertY: false,
  headBob: 1.0,
  trail: 26,
  sound: false,
  volume: 0.55,
  showHud: true,
  msaa: true,
  /* Megabytes of video memory the render targets may use. This is the
     setting that stops a high-DPI display asking the GPU for the better
     part of a gigabyte and getting a half-painted frame back. */
  vramBudget: 160,
  /* Thousands of blades that may be submitted in a frame. Tile-based
     GPUs drop geometry silently once their binning buffer overflows,
     and nothing in the API says where that is - so this is a ceiling
     you can move until the field stops disappearing. */
  maxBlades: 180
};

/* A phone is not a small desktop: the GPU is tile-based, sustained load
   gets thermally throttled within a minute, and the whole budget has to
   come down by an order of magnitude rather than a notch. */
const IS_PHONE = (() => {
  try {
    return matchMedia('(hover: none) and (pointer: coarse)').matches
        && Math.min(screen.width, screen.height) < 820;
  } catch (e) { return false; }
})();

const QUALITY_PRESETS = {
  phone:  { renderScale: 0.60, density: 0.22, grassRange: 38, bloomLevels: 4, msaa: 1 },
  low:    { renderScale: 0.62, density: 0.35, grassRange: 70,  bloomLevels: 4, msaa: 1 },
  medium: { renderScale: 0.85, density: 0.65, grassRange: 100, bloomLevels: 5, msaa: 2 },
  high:   { renderScale: 1.00, density: 1.00, grassRange: 130, bloomLevels: 5, msaa: 4 },
  ultra:  { renderScale: 1.25, density: 1.55, grassRange: 130, bloomLevels: 5, msaa: 4 }
};

/* ------------------------------------------------------------------ */

class World {
  constructor(canvas, skyImage, light) {
    this.canvas = canvas;
    this.light = light;
    this.glw = new GL(canvas);
    const gl = this.glw.gl;
    this.settings = loadSettings(DEFAULTS);
    if (IS_PHONE && !this.settings._touched) {
      this.settings.quality = 'phone';
      this.settings.grassRange = 38;
      this.settings.density = 0.22;
      this.settings.renderScale = 0.60;
      this.settings.msaa = false;
      this.settings.vramBudget = 64;
      this.settings.trail = 12;
      this.settings.maxBlades = 90;
    }
    if (SAFE_MODE) {
      /* this machine has already fallen over once - come back gently */
      this.settings.msaa = false;
      this.settings.density = Math.min(this.settings.density, 0.5);
      this.settings.grassRange = Math.min(this.settings.grassRange, 70);
      this.settings.vramBudget = Math.min(this.settings.vramBudget, 64);
      this.settings.maxBlades = Math.min(this.settings.maxBlades, 90);
    }

    /* ---------------- textures -------------------------------------- */
    this.skyTex = this.glw.texture({
      image: skyImage, wrap: gl.REPEAT, wrapT: gl.CLAMP_TO_EDGE, filter: gl.LINEAR
    });

    this.heightPeriod = 1024;
    this.heightScale = 4.2;
    this.heightRes = 1024;
    this.heightData = this.bakeHeight(this.heightRes);
    this.heightTex = this.glw.texture({
      w: this.heightRes, h: this.heightRes, internal: gl.R16F, format: gl.RED,
      type: gl.HALF_FLOAT, data: toHalfFloat(this.heightData),
      wrap: gl.REPEAT, filter: gl.LINEAR
    });

    this.fieldPeriod = 64;
    this.tussock = 0.46;
    this.fieldRes = 256;
    this.fieldData = this.bakeField(this.fieldRes);
    this.fieldTex = this.glw.texture({
      w: this.fieldRes, h: this.fieldRes, data: this.fieldData,
      wrap: gl.REPEAT, filter: gl.LINEAR
    });

    /* One metre scale: tussock mounds, per-tuft comb, blade length.
       Kept apart from the field texture because the two live at
       completely different scales and sharing one made both worse. */
    this.detailPeriod = 12;
    this.detailRes = 256;
    this.detailData = this.bakeDetail(this.detailRes);
    this.detailTex = this.glw.texture({
      w: this.detailRes, h: this.detailRes, data: this.detailData,
      wrap: gl.REPEAT, filter: gl.LINEAR
    });

    this.matTex = this.glw.texture({
      w: 512, h: 512, data: this.bakeMat(512),
      wrap: gl.REPEAT, filter: gl.LINEAR, mips: true, aniso: 8
    });

    /* ---------------- passes ---------------------------------------- */
    this.sky = new SkyPass(this.glw);
    this.terrain = new Terrain(this.glw, 170, 256, 18000);
    this.grass = new Grass(this.glw);
    this.flies = new Fireflies(this.glw, 900);
    this.trample = new Trample(this.glw, 512, 56);
    this.post = new Post(this.glw);

    /* ---------------- lighting from the photograph ------------------ */
    this.sh = new Float32Array(27);
    for (let i = 0; i < 9; i++) {
      const c = light.sh[i];
      this.sh[i * 3] = c[0]; this.sh[i * 3 + 1] = c[1]; this.sh[i * 3 + 2] = c[2];
    }
    this.calibrate();

    /* ---------------- player ---------------------------------------- */
    this.pos = [0, 0, 0];
    this.vel = [0, 0, 0];
    this.yaw = 0.32;
    this.pitch = 0.02;
    this.eye = 1.68;
    this.eyeCur = 1.68;
    this.bobPhase = 0;
    this.bobAmt = 0;
    this.grounded = true;
    this.vy = 0;
    this._playerXZ = new Float32Array(2);
    this._playerHeading = new Float32Array(2);
    this._playerSpeedN = 0;
    this.roll = 0;

    this.time = 0;
    this.windTime = 0;
    this.windAngle = 0.7;
    this.windDir = new Float32Array([Math.cos(0.7), Math.sin(0.7)]);
    this.gust = 0.5;
    this.windClock = 0;
    this.gustNow = 1;
    this.windStrength = 0;
    this.windNoise = makeWindNoise(90210);
    this.veerNoise = makeWindNoise(31415);

    /* ---------------- matrices -------------------------------------- */
    this.proj = M4.ident();
    this.viewM = M4.ident();
    this.viewProj = M4.ident();
    this.invViewProj = M4.ident();
    this.camPos = new Float32Array(3);
    this.fwdXZ = new Float32Array(2);

    this.scene = null;
    this.rw = 0; this.rh = 0;
    this.samples = 1;
    /* Deliberately conservative to begin with. On a Retina display this
       lands at roughly one buffer pixel per CSS pixel, which looks right
       and costs a fifth of what going native would; auto-quality raises
       it if the machine turns out to have the headroom. */
    this.lastResizeAt = 0;
    this.frameMs = 16;
    this.fps = 60;
    this.autoScale = 1.0;

    /* Prove the pipeline works here before trusting it. Anything that
       fails is switched off rather than left to misbehave silently. */
    this.selfTest = runSelfTest(this.glw, this.heightTex,
                                this.heightData, this.heightRes);
    if (this.selfTest.halfFloatTargets === false && this.glw.hdr) {
      this.glw.hdr = false;
      this.glw.hdrFormat = gl.RGBA8;
      this.selfTest.notes.push('fell back to 8-bit render targets');
    }
    if (this.selfTest.msaaResolve === false && this.settings.msaa) {
      this.settings.msaa = false;
      this.selfTest.notes.push('fell back to no multisampling');
    }

    this.env = this.makeEnv();
  }

  /* ================================================================
     Baking. Everything the shaders read about the shape of the field
     is generated here, once, so that the CPU and the GPU are looking
     at literally the same numbers.
     ================================================================ */

  bakeHeight(res) {
    const f = makeFbm(1337, 4, 7, 0.55);
    const out = new Float32Array(res * res);
    for (let y = 0; y < res; y++) {
      for (let x = 0; x < res; x++) out[y * res + x] = f(x / res, y / res);
    }
    return out;
  }

  /** Bilinear sample of a baked texture channel, matching the shader. */
  sampleBaked(data, res, stride, ch, x, z, period) {
    let u = (x / period) * res, v = (z / period) * res;
    const xi = Math.floor(u), yi = Math.floor(v);
    const fx = u - xi, fy = v - yi;
    const x0 = ((xi % res) + res) % res, y0 = ((yi % res) + res) % res;
    const x1 = (x0 + 1) % res, y1 = (y0 + 1) % res;
    const g = (X, Y) => data[(Y * res + X) * stride + ch];
    return lerp(lerp(g(x0, y0), g(x1, y0), fx), lerp(g(x0, y1), g(x1, y1), fx), fy);
  }

  /** The CPU's copy of surfaceHeight(): terrain plus tussock mounds. */
  surfaceAt(x, z) {
    const t = this.sampleBaked(this.detailData, this.detailRes, 4, 0, x, z,
                               this.detailPeriod) / 255;
    return this.groundAt(x, z) + (t - 0.5) * this.tussock;
  }

  /**
   * Where a person's feet actually go. Not the same as surfaceAt: you
   * walk BETWEEN tussocks and push through them, you do not step neatly
   * over each dome, and following them exactly turns a walk across the
   * field into a ride on a trampoline.
   */
  walkAt(x, z) {
    const t = this.sampleBaked(this.detailData, this.detailRes, 4, 0, x, z,
                               this.detailPeriod) / 255;
    return this.groundAt(x, z) + (t - 0.5) * this.tussock * 0.28;
  }

  /** Height in metres at a world position - the CPU's copy of groundHeight(). */
  groundAt(x, z) {
    const res = this.heightRes, d = this.heightData;
    let u = (x / this.heightPeriod) * res, v = (z / this.heightPeriod) * res;
    const xi = Math.floor(u), yi = Math.floor(v);
    const fx = u - xi, fy = v - yi;
    const x0 = ((xi % res) + res) % res, y0 = ((yi % res) + res) % res;
    const x1 = (x0 + 1) % res, y1 = (y0 + 1) % res;
    const a = d[y0 * res + x0], b = d[y0 * res + x1];
    const c = d[y1 * res + x0], e = d[y1 * res + x1];
    return lerp(lerp(a, b, fx), lerp(c, e, fx), fy) * this.heightScale;
  }

  bakeField(res) {
    /* gusts: long rolling waves, tens of metres across */
    const gust = makeFbm(20214, 2, 4, 0.58);
    /* tufts */
    const clump = makeFbm(9091, 8, 4, 0.5);
    /* the lie of the grass, as an offset from the prevailing wind */
    const comb = makeFbm(4242, 3, 3, 0.5);
    /* where the grass thins out. Stretched 5:1 so the bare ground comes
       in swathes and tracks, the way it does in the photograph, rather
       than in round bald spots. */
    const bare = makeFbm2(777, 3, 15, 4, 0.55);

    const out = new Uint8Array(res * res * 4);
    for (let y = 0; y < res; y++) {
      for (let x = 0; x < res; x++) {
        const u = x / res, v = y / res, i = (y * res + x) * 4;
        out[i] = (gust(u, v) * 255) | 0;
        /* stretch the clump contrast so tufts read as tufts */
        const c = clamp((clump(u, v) - 0.5) * 1.95 + 0.5, 0, 1);
        out[i + 1] = (c * 255) | 0;
        out[i + 2] = (comb(u, v) * 255) | 0;
        const b = clamp((bare(u, v) - 0.46) * 2.3 + 0.5, 0, 1);
        out[i + 3] = (b * 255) | 0;
      }
    }
    return out;
  }

  /**
   * Tussocks. Deliberately only two octaves: the point of this field is
   * that it is SMOOTH at a metre. Fine detail here does not read as
   * texture, it reads as speckle, and it destroys the very grouping the
   * field is here to create.
   */
  bakeDetail(res) {
    const mound = makeFbm(5150, 6, 2, 0.45);
    const comb = makeFbm(8801, 5, 2, 0.5);
    const len = makeFbm(2233, 7, 2, 0.5);
    const spare = makeFbm(4477, 9, 2, 0.5);
    const out = new Uint8Array(res * res * 4);
    for (let y = 0; y < res; y++) {
      for (let x = 0; x < res; x++) {
        const u = x / res, v = y / res, i = (y * res + x) * 4;
        out[i] = clamp((mound(u, v) - 0.5) * 1.7 + 0.5, 0, 1) * 255;
        out[i + 1] = comb(u, v) * 255;
        out[i + 2] = len(u, v) * 255;
        out[i + 3] = spare(u, v) * 255;
      }
    }
    return out;
  }

  /**
   * The mat of thatch under the blades. RG is a tangent-space normal,
   * A is how much dead stalk is showing. Strongly stretched along one
   * axis so it reads as combed grass; the shader spins it to follow the
   * local comb direction.
   */
  bakeMat(res) {
    const streak = makeFbm2(31337, 3, 24, 5, 0.55);
    const speck = makeFbm2(6161, 40, 40, 3, 0.5);
    const h = new Float32Array(res * res);
    for (let y = 0; y < res; y++) {
      for (let x = 0; x < res; x++) {
        const u = x / res, v = y / res;
        h[y * res + x] = streak(u, v) * 0.78 + speck(u, v) * 0.22;
      }
    }
    const out = new Uint8Array(res * res * 4);
    const at = (x, y) => h[(((y % res) + res) % res) * res + (((x % res) + res) % res)];
    for (let y = 0; y < res; y++) {
      for (let x = 0; x < res; x++) {
        const dx = (at(x + 1, y) - at(x - 1, y)) * 3.2;
        const dy = (at(x, y + 1) - at(x, y - 1)) * 3.2;
        const i = (y * res + x) * 4;
        out[i] = clamp(-dx * 0.5 + 0.5, 0, 1) * 255;
        out[i + 1] = clamp(-dy * 0.5 + 0.5, 0, 1) * 255;
        out[i + 2] = 255;
        const v = h[y * res + x];
        out[i + 3] = clamp((v - 0.42) * 2.0 + 0.5, 0, 1) * 255;
      }
    }
    return out;
  }

  /* ================================================================
     Colour calibration.

     We know two things: the spherical-harmonic irradiance of the sky
     that is actually lighting this field, and the exact colour the
     grass came out in the photograph. Dividing one by the other gives
     the albedo that lands the render back on the photograph, instead
     of on a number somebody liked the look of.
     ================================================================ */
  shIrradianceJS(n) {
    const c1 = 0.429043, c2 = 0.511664, c3 = 0.743125, c4 = 0.886227, c5 = 0.247708;
    const L = (i, k) => this.sh[i * 3 + k];
    const out = [0, 0, 0];
    for (let k = 0; k < 3; k++) {
      out[k] = c1 * L(8, k) * (n[0] * n[0] - n[1] * n[1])
             + c3 * L(6, k) * (n[2] * n[2])
             + c4 * L(0, k)
             - c5 * L(6, k)
             + 2 * c1 * (L(4, k) * n[0] * n[1] + L(7, k) * n[0] * n[2] + L(5, k) * n[1] * n[2])
             + 2 * c2 * (L(3, k) * n[0] + L(1, k) * n[1] + L(2, k) * n[2]);
    }
    return out;
  }

  calibrate() {
    const p = this.light.groundPercentiles;

    /* Take the HUE from the photograph and the LEVEL from physics.
       Dividing the photograph's grass colour straight through by the
       sky's irradiance asks for an albedo above 1 at the bright end -
       those pale streaks are backlit and specular, not diffuse - and
       clamping there turns every highlight grey. So the measured colour
       sets the ratio between the channels, plausible grass reflectances
       set the magnitude, and one scalar (groundLift) carries what is
       really a long exposure's lifted shadows. */
    const hue = (t) => {
      const m = Math.max(t[0], t[1], t[2], 1e-6);
      return [t[0] / m, t[1] / m, t[2] / m];
    };
    /* Divide the photograph's colour by the sky's, THEN normalise. The
       sky lighting this field is blue-green, so an albedo copied
       straight off the photograph comes out grey once that sky is
       multiplied through it. Dividing first asks the right question:
       what colour must this grass be for THIS sky to render it the
       colour the photograph recorded? Magnitude stays free - only the
       ratio between channels is being fixed here. */
    const amb = this.shIrradianceJS([0, 1, 0]).map(v => Math.max(v / Math.PI, 1e-6));
    const reflectance = (t) => hue([t[0] / amb[0], t[1] / amb[1], t[2] / amb[2]]);
    const hd = reflectance(p['25']);
    /* the top 2% is where the silver strands live: nearly neutral */
    const hl = reflectance(p['98']).map((v) => v * 0.82 + 0.18);
    this.grassDark = new Float32Array(hd.map((v) => v * 0.046));
    this.grassLight = new Float32Array(hl.map((v) => v * 0.700));
    this.ambientUp = this.shIrradianceJS([0, 1, 0]).map(v => v / Math.PI);

    const az = this.light.coreAzimuthDeg * DEG, el = this.light.coreElevationDeg * DEG;
    const ct = Math.cos(el);
    this.coreDir = new Float32Array([ct * Math.sin(az), Math.sin(el), -ct * Math.cos(az)]);
    const h = this.light.horizonRadiance;
    this.coreColour = new Float32Array([h[0] * 3.2, h[1] * 3.0, h[2] * 2.9]);
  }

  /* ================================================================ */

  makeEnv() {
    const gl = this.glw.gl, w = this;
    return {
      get viewProj() { return w.viewProj; },
      get invViewProj() { return w.invViewProj; },
      get camPos() { return w.camPos; },
      get fwdXZ() { return w.fwdXZ; },
      get cullDot() { return w.cullDot; },
      get windDir() { return w.windDir; },
      get windTime() { return w.windTime; },
      get windStrength() { return clamp(w.windStrength, 0, 2.6); },
      /* Prairie grass is not a lawn: it lies over. Roughly 30 degrees
         at rest, more as the wind gets up. */
      get baseBend() { return 0.50 + clamp(w.windStrength, 0, 2.0) * 0.16; },
      get playerXZ() { return w._playerXZ; },
      get playerHeading() { return w._playerHeading; },
      get playerSpeed() { return w._playerSpeedN; },
      get partRadius() { return w.settings.partRadius; },
      get partStrength() { return w.settings.partStrength; },
      get density() { return w._density; },
      get grassRange() { return w._range; },
      get bladeBudget() { return Math.max(20000, w.settings.maxBlades * 1000 * w.autoScale); },
      get bladeHeight() { return w.settings.bladeHeight; },
      get bladeWidth() { return 0.0086; },
      get grassDark() { return w.grassDark; },
      get grassLight() { return w.grassLight; },
      get coreDir() { return w.coreDir; },
      get coreColour() { return w.coreColour; },
      /* A blade of grass is glossy, but at night the only thing bright
         enough to make a highlight is the galactic core, and that is a
         soft area source - hence high roughness and a low weight. Any
         more than this and the field fills with white speckle. */
      get specular() { return 0.22; },
      /* how hard the sky glints off the leaf surface */
      get sheen() { return w.settings.sheen; },
      get translucency() { return 0.88; },
      get backLight() { return 0.36; },
      get groundGain() { return w.settings.groundLift; },
      get matTex() { return w.matTex; },
      get starAmount() { return w.settings.stars; },

      bindCommon(p) {
        w.glw.bindTex(0, w.skyTex); gl.uniform1i(p.u.uSky, 0);
        w.glw.bindTex(1, w.fieldTex); gl.uniform1i(p.u.uField, 1);
        w.glw.bindTex(2, w.heightTex); gl.uniform1i(p.u.uHeight, 2);
        w.glw.bindTex(3, w.trample.texture); gl.uniform1i(p.u.uTrample, 3);
        w.glw.bindTex(5, w.detailTex); gl.uniform1i(p.u.uDetail, 5);
        gl.uniform1f(p.u.uDetailPeriod, w.detailPeriod);
        gl.uniform1f(p.u.uSkyLift, w.light.blackLift);
        gl.uniform1f(p.u.uSkyScale, w.light.blackScale);
        gl.uniform1f(p.u.uHighlightBoost, 0.17);
        gl.uniform1f(p.u.uTime, w.time);
        gl.uniform3fv(p.u.uSH, w.sh);
        gl.uniform1f(p.u.uFogDensity, 0.0170);
        gl.uniform1f(p.u.uFogTint, 1.0);
        gl.uniform1f(p.u.uFieldPeriod, w.fieldPeriod);
        gl.uniform1f(p.u.uHeightPeriod, w.heightPeriod);
        gl.uniform1f(p.u.uHeightScale, w.heightScale);
        gl.uniform3fv(p.u.uTrampleWin, w.trample.window);
        gl.uniform1f(p.u.uTussock, w.tussock);
        gl.uniform2fv(p.u.uWind, w.windDir);
      }
    };
  }

  /* ---------------------------------------------------------------- */

  /**
   * Choose a drawing-buffer size and a sample count together, against a
   * video-memory budget.
   *
   * This is the bug that made the ground stop being painted. Capping
   * devicePixelRatio at 2 is not enough on its own: a 4x multisampled
   * RGBA16F colour buffer and its depth buffer cost 48 bytes for every
   * drawing-buffer pixel, so an uncapped Retina laptop asked for 8.3 MP
   * (~460 MB of render targets) and a 27-inch Retina display for 14.7 MP
   * (~825 MB). A laptop GPU answers that by thrashing, dropping draws or
   * losing the context, and what you see is a half-painted frame.
   *
   * Budgeting PIXELS alone is not enough either - that spends the whole
   * allowance on samples and then renders below one buffer pixel per CSS
   * pixel, which is softer than it needs to be. So: take the resolution
   * first, down to 1x CSS, and spend whatever is left on antialiasing.
   */
  planTarget() {
    const s = this.settings;
    const gl = this.glw.gl;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const scale = s.renderScale * this.autoScale;

    const cssPx = Math.max(innerWidth * innerHeight, 1);
    const wantPx = Math.min(cssPx * dpr * dpr * scale * scale, 6.0e6);
    /* below this the upscale starts to show, so we trade samples first */
    const floorPx = cssPx * scale * scale;

    const budget = clamp(s.vramBudget, 48, 1024) * 1048576;
    /* colour + depth are multisampled; the resolve, bloom chain and the
       canvas itself are not */
    const bytesPerPx = (n) => 12 * n + 18.7;
    const maxPxFor = (n) => budget / bytesPerPx(n);

    const wanted = s.msaa
      ? ((QUALITY_PRESETS[s.quality] || QUALITY_PRESETS.high).msaa || 4) : 1;
    const maxSamples = Math.min(wanted, gl.getParameter(gl.MAX_SAMPLES) || 1);

    let samples = 1, px = Math.min(wantPx, maxPxFor(1));
    for (let n = maxSamples; n >= 1; n--) {
      const cap = maxPxFor(n);
      if (cap >= floorPx || n === 1) { samples = n; px = Math.min(wantPx, cap); break; }
    }

    const aspect = innerWidth / Math.max(innerHeight, 1);
    let h = Math.sqrt(px / Math.max(aspect, 1e-3));
    let w = h * aspect;

    const lim = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE),
                         gl.getParameter(gl.MAX_RENDERBUFFER_SIZE));
    const shrink = Math.max(w / lim, h / lim, 1);
    return {
      w: Math.max(320, Math.round(w / shrink)),
      h: Math.max(240, Math.round(h / shrink)),
      samples: samples > 1 ? samples : 1
    };
  }

  resize() {
    const gl = this.glw.gl;
    const plan = this.planTarget();
    const { w, h } = plan;

    this.canvas.width = w;
    this.canvas.height = h;
    this.canvas.style.width = '100%';
    this.canvas.style.height = '100%';
    if (this.rw === w && this.rh === h && this.samples === plan.samples) return;
    this.rw = w; this.rh = h;

    if (this.scene) this.scene.free();
    this.scene = plan.samples > 1
      ? this.glw.targetMS(w, h, plan.samples, { depth: true })
      : this.glw.target(w, h, { depth: true });
    const preset = QUALITY_PRESETS[this.settings.quality] || QUALITY_PRESETS.high;
    this.post.resize(w, h, preset.bloomLevels || 6);
    this.samples = this.scene.samples || 1;

    /* Running out of video memory is reported through getError, not by an
       exception, and the symptom downstream is a half-painted frame rather
       than a crash. If it happens, halve the budget and try again. */
    const err = gl.getError();
    if (err === gl.OUT_OF_MEMORY && this.settings.vramBudget > 56) {
      console.warn('dark-sky-reserve: out of video memory at ' + w + 'x' + h +
                   ' (' + plan.samples + 'x AA), halving the budget');
      this.settings.vramBudget = Math.max(48, this.settings.vramBudget * 0.5);
      this.rw = this.rh = 0;
      this.resize();
    }
  }

  /** Gust strength at the player, for the sound and the readout. */
  gustAt(x, z) {
    const res = this.fieldRes, d = this.fieldData;
    const sx = x - this.windDir[0] * this.windTime * 2.6;
    const sz = z - this.windDir[1] * this.windTime * 2.6;
    let u = (sx / this.fieldPeriod) * res, v = (sz / this.fieldPeriod) * res;
    const xi = Math.floor(u), yi = Math.floor(v);
    const fx = u - xi, fy = v - yi;
    const x0 = ((xi % res) + res) % res, y0 = ((yi % res) + res) % res;
    const x1 = (x0 + 1) % res, y1 = (y0 + 1) % res;
    const g = (X, Y) => d[(Y * res + X) * 4] / 255;
    return lerp(lerp(g(x0, y0), g(x1, y0), fx), lerp(g(x0, y1), g(x1, y1), fx), fy);
  }

  step(dt, input, audio) {
    const s = this.settings;
    this.time += dt;

    /* ---- wind ------------------------------------------------------
       Strength is a mean with gusts on top, not a constant. The noise is
       raised to a power that grows with gustiness, which is what puts the
       field in a lull most of the time and makes the gusts brief - the
       thing that reads as weather rather than as animation. Everything
       still scales with the Wind setting, so 0 is genuinely still. */
    const live = Math.min(1, s.wind * 1.4);
    this.windClock += dt * (0.09 + 0.30 * s.gustRate) * live;

    const n = clamp(this.windNoise(this.windClock, 4), 0, 1);
    const shaped = Math.pow(n, 1.0 + 1.4 * s.gustiness);
    this.gustNow = lerp(1 - 0.70 * s.gustiness, 1 + 1.60 * s.gustiness, shaped);
    this.windStrength = Math.max(0, s.wind * this.gustNow);

    /* the direction veers with the gusts, and harder in a squall */
    const veer = this.veerNoise(this.windClock * 0.41 + 17.0, 3) - 0.5;
    this.windAngle += dt * veer * (0.06 + 1.10 * s.windShift) * live;
    this.windDir[0] = Math.cos(this.windAngle);
    this.windDir[1] = Math.sin(this.windAngle);

    /* the waves travel faster in a gust, which is most of the "flow" */
    this.windTime += dt * 1.15 * live * (0.45 + 0.75 * this.gustNow);

    /* ---- look ---- */
    const [ldx, ldy] = input.takeLook();
    this.yaw += ldx;
    /* short of straight up: the view basis degenerates when the
       forward vector lines up with world up */
    this.pitch = clamp(this.pitch - ldy, -1.45, 1.45);
    if (this.yaw > Math.PI) this.yaw -= TAU;
    if (this.yaw < -Math.PI) this.yaw += TAU;

    /* ---- move ---- */
    const mv = input.moveVector();
    const run = input.running(), crouch = input.crouching();
    const sy = Math.sin(this.yaw), cy = Math.cos(this.yaw);
    /* wading through waist-high grass is not a sprint */
    const base = crouch ? 1.05 : (run ? 3.5 : 1.55);
    const target = [
      (mv[0] * cy + mv[1] * sy) * base,
      (mv[0] * sy - mv[1] * cy) * base
    ];
    this.vel[0] = approach(this.vel[0], target[0], 9.0, dt);
    this.vel[2] = approach(this.vel[2], target[1], 9.0, dt);

    this.pos[0] += this.vel[0] * dt;
    this.pos[2] += this.vel[2] * dt;

    const gh = this.walkAt(this.pos[0], this.pos[2]);
    if (this.grounded && input.jumping()) { this.vy = 4.1; this.grounded = false; }
    if (!this.grounded) {
      this.vy -= 18.0 * dt;
      this.pos[1] += this.vy * dt;
      if (this.pos[1] <= gh) { this.pos[1] = gh; this.vy = 0; this.grounded = true; }
    } else {
      this.pos[1] = gh;
    }

    /* ---- head ---- */
    const speed = Math.hypot(this.vel[0], this.vel[2]);
    this.eye = approach(this.eye, crouch ? 1.06 : 1.68, 8.0, dt);
    const bobTarget = this.grounded ? Math.min(speed / 3.5, 1) : 0;
    this.bobAmt = approach(this.bobAmt, bobTarget, 6.0, dt);
    const prevPhase = this.bobPhase;
    this.bobPhase += speed * dt * (crouch ? 2.6 : 1.85);
    if (this.grounded && Math.floor(this.bobPhase / Math.PI) > Math.floor(prevPhase / Math.PI)) {
      audio.footstep(0.4 + this.bobAmt * 0.7);
    }
    const bob = s.headBob;
    this.eyeCur = this.eye
      + Math.sin(this.bobPhase * 2) * 0.030 * this.bobAmt * bob
      - this.bobAmt * 0.018 * bob;
    const sway = Math.sin(this.bobPhase) * 0.026 * this.bobAmt * bob;
    /* a touch of roll when you strafe, the way a shoulder-carried camera does */
    const strafe = (this.vel[0] * cy + this.vel[2] * sy) / Math.max(base, 0.001);
    this.roll = approach(this.roll, -strafe * 0.022 - sway * 0.35, 7.0, dt);

    /* The tussock field has centimetre-scale detail in it, which is
       right for the grass and far too busy for a head. The body follows
       the ground exactly; the camera follows the body through a filter. */
    this.groundSmooth = this.groundSmooth === undefined
      ? this.pos[1] : approach(this.groundSmooth, this.pos[1], 13.0, dt);

    this._playerXZ[0] = this.pos[0];
    this._playerXZ[1] = this.pos[2];
    /* heading and speed drive the wake the grass opens around you */
    const moveSpeed = Math.hypot(this.vel[0], this.vel[2]);
    this._playerSpeedN = clamp(moveSpeed / 3.5, 0, 1.2);
    if (moveSpeed > 0.05) {
      this._playerHeading[0] = approach(this._playerHeading[0], this.vel[0] / moveSpeed, 9.0, dt);
      this._playerHeading[1] = approach(this._playerHeading[1], this.vel[2] / moveSpeed, 9.0, dt);
    }
    this.gust = this.gustAt(this.pos[0], this.pos[2]) * this.gustNow;
    audio.update(this.gust, speed, this.windStrength);

    /* ---- camera basis ---- */
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const fwd = [sy * cp, sp, -cy * cp];
    this.camPos[0] = this.pos[0] + sway * cy;
    this.camPos[1] = this.groundSmooth + this.eyeCur;
    this.camPos[2] = this.pos[2] + sway * sy;
    this.fwdXZ[0] = sy; this.fwdXZ[1] = -cy;

    const aspect = this.canvas.width / Math.max(this.canvas.height, 1);
    let fovY = s.fov * DEG;
    if (aspect < 1.0) {
      /* Held upright, a fixed vertical field of view collapses the
         horizontal one - 68 degrees vertical on a phone leaves about 35
         across, which is a letterbox slot. Widen until either the
         horizontal view is reasonable or the vertical distortion is. */
      const fromH = 2 * Math.atan(Math.tan(58 * DEG * 0.5) / aspect);
      fovY = clamp(Math.max(fovY, fromH), fovY, 88 * DEG);
    }
    M4.perspective(this.proj, fovY, aspect, 0.055, 26000);
    /* roll about the view axis: rotate the world up vector around forward */
    const upv = rotateAboutAxis([0, 1, 0], fwd, this.roll);
    M4.view(this.viewM, this.camPos, fwd, upv);
    M4.mul(this.viewProj, this.proj, this.viewM);
    M4.invert(this.invViewProj, this.viewProj);

    /* how far off-axis a blade can be before we stop submitting it */
    const halfH = Math.atan(Math.tan(fovY * 0.5) * aspect);
    this.cullDot = Math.cos(Math.min(halfH + 0.6, Math.PI));

    /* ---- quality ---- */
    const preset = QUALITY_PRESETS[s.quality];
    this._density = clamp(s.density * (preset ? preset.density : 1.0) * this.autoScale, 0.05, 2.0);
    this._range = Math.min(s.grassRange, preset ? preset.grassRange : s.grassRange);
  }

  render(dt) {
    const gl = this.glw.gl, s = this.settings;

    this.trample.update(this.pos[0], this.pos[2], dt,
                        0.48 + 0.42 * this._playerSpeedN, Math.max(s.trail, 0.5));

    this.glw.bindTarget(this.scene, true);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);

    this.sky.draw(this.env);
    this.terrain.draw(this.env);
    this.grass.draw(this.env);
    this.flies.draw(this.env, s.fireflies);

    if (this.scene.resolve) this.scene.resolve();

    const bloomTex = this.post.bloom(this.scene.tex, s.exposure, 0.32, 0.18, 1.3);
    this.post.composite(this.scene.tex, bloomTex, s);

    /* Grab the frame here, still inside the task that drew it. Without
       preserveDrawingBuffer the contents are gone once we yield. */
    if (this._shot) {
      const done = this._shot;
      this._shot = null;
      try { this.canvas.toBlob(done, 'image/png'); } catch (e) { done(null); }
    }
  }

  /** Ask for a PNG of the next rendered frame. */
  requestShot(done) { this._shot = done; }
}

/** Rotate `v` about unit axis `a` by angle `t` (Rodrigues). */
function rotateAboutAxis(v, a, t) {
  const c = Math.cos(t), s = Math.sin(t);
  const d = a[0] * v[0] + a[1] * v[1] + a[2] * v[2];
  const cx = a[1] * v[2] - a[2] * v[1];
  const cy = a[2] * v[0] - a[0] * v[2];
  const cz = a[0] * v[1] - a[1] * v[0];
  return [
    v[0] * c + cx * s + a[0] * d * (1 - c),
    v[1] * c + cy * s + a[1] * d * (1 - c),
    v[2] * c + cz * s + a[2] * d * (1 - c)
  ];
}

function boot() {
  const canvas = $('view');
  /* A renderer that dies without saying why is just badly built. */
  addEventListener('error', (e) => {
    if (!window.__world && e && e.message) {
      const n = document.getElementById('gateNote');
      const lw = document.getElementById('loadWrap');
      if (n && lw && !lw.hidden) {
        lw.hidden = true;
        n.innerHTML = 'Something threw while starting up.<br><br>' +
          '<span style="opacity:.6">' + String(e.message) + '</span>';
      }
    }
  });
  const gate = $('gate');
  const note = $('gateNote');

  const fail = (msg, detail) => {
    $('loadWrap').hidden = true;
    $('playBtn').hidden = true;
    note.innerHTML = msg + (detail ? '<br><br><span style="opacity:.6">' + detail + '</span>' : '');
  };

  let world, input, audio;
  let running = true;

  const setProgress = (pct, msg) => {
    $('loadBar').firstElementChild.style.width = pct + '%';
    if (msg) $('loadMsg').textContent = msg;
  };

  /* ---- load the sky plate, then build the world ---- */
  setProgress(12, 'unrolling the sky…');
  const img = new Image();
  img.onload = () => {
    setProgress(46, 'sowing the field…');
    /* let the bar paint before the (synchronous) bake blocks the thread */
    requestAnimationFrame(() => setTimeout(() => {
      try {
        world = new World(canvas, img, SKY_LIGHT);
      } catch (e) {
        console.error(e);
        if (String(e.message).indexOf('WEBGL2') >= 0) {
          fail('This needs WebGL 2, and this browser has not got it.',
               'Try a current Chrome, Edge, Firefox or Safari, and check that ' +
               'hardware acceleration is switched on.');
        } else {
          fail('The renderer failed to start.', String(e.message));
        }
        return;
      }
      setProgress(100, 'ready');
      /* start() allocates every render target we own, and GL.target throws
         if the driver will not give us one. Outside a try that exception
         is uncaught, the Play button never appears, and all you get is a
         progress bar that stops - which is exactly what it did. */
      try {
        start(world);
      } catch (e) {
        console.error(e);
        fail('The renderer started but could not set itself up.',
             String(e && e.message || e) +
             '<br><br>This is usually the GPU refusing a render target. ' +
             'Opening the file in a normal browser window (rather than a ' +
             'preview pane) fixes it most of the time.');
      }
    }, 30));
  };
  img.onerror = () => fail('The sky image did not load.');
  img.src = SKY_IMAGE;

  /* ================================================================ */
  function start(world) {
    input = new Input(canvas);
    audio = new Ambience();
    input.stickEl = document.createElement('div');
    input.stickEl.id = 'stick';
    input.stickEl.innerHTML = '<i></i>';
    input.stickEl.style.opacity = '0';
    document.body.appendChild(input.stickEl);

    const isTouch = matchMedia('(hover: none)').matches || 'ontouchstart' in window;
    if (isTouch) document.body.classList.add('touch');

    const s = world.settings;
    input.sensitivity = s.sensitivity;
    input.invertY = s.invertY;
    audio.setVolume(s.volume);

    world.resize();
    let resizeT = 0;
    addEventListener('resize', () => {
      compassDirty = true;
      /* Mobile browsers fire this every time the URL bar slides, and each
         one would otherwise reallocate every render target we own. */
      clearTimeout(resizeT);
      resizeT = setTimeout(() => world.resize(), 180);
    });

    /* A lost context is otherwise completely silent: the loop keeps
       running, every draw is a no-op, and all you see is a black screen. */
    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      running = false;
      markSafeRestart();
      gate.classList.remove('gone');
      $('loadWrap').hidden = true;
      $('playBtn').hidden = true;
      $('gateKeys').hidden = true;
      note.innerHTML = 'The graphics context was lost - usually the GPU running out of ' +
        'memory.<br><br><button id="reloadBtn" style="margin-top:10px">Reload, more gently</button>';
      const rb = $('reloadBtn');
      if (rb) rb.addEventListener('click', () => location.reload());
    });

    if (SAFE_MODE) {
      setTimeout(() => toast('restarted at reduced quality after a graphics fault'), 900);
      /* one clean minute and we stop treating this machine as fragile */
      setTimeout(clearSafeRestart, 60000);
    }

    buildPanel(world, input, audio);
    applyHud(s);

    $('loadWrap').hidden = true;
    $('playBtn').hidden = false;
    $('gateKeys').hidden = isTouch;
    note.innerHTML = isTouch
      ? 'Drag on the left to walk, on the right to look.'
      : 'Mouse to look, WASD to walk. If the cursor stays visible, this page is not ' +
        'allowed to capture it \u2014 hold the mouse button down to look around instead.' +
        '<br><br><span style="opacity:.55">In December 2020 the Yorkshire Dales and the ' +
        'North York Moors were designated International Dark Sky Reserves together: ' +
        '3,615 km\u00b2, the largest area in the UK ever designated at once. This is a ' +
        'walk through that kind of dark.</span>';

    const enter = () => {
      gate.classList.add('gone');
      document.body.classList.add('playing');
      if (!isTouch) input.requestLock();
      if (s.sound) audio.setEnabled(true);
    };
    $('playBtn').addEventListener('click', enter);
    canvas.addEventListener('click', () => {
      if (!gate.classList.contains('gone')) return;
      if (!isTouch && !input.locked && $('panel').classList.contains('hidden')) input.requestLock();
    });

    input.onLockChange = (locked) => {
      if (!locked) document.body.classList.remove('playing');
      else document.body.classList.add('playing');
    };

    /* Pointer lock is refused inside a sandboxed frame, which is how the
       hosted page is served, and it fails by simply never locking rather
       than by raising an error. Fall back to dragging and say so, rather
       than leaving the mouse apparently dead. */
    input.onLockUnavailable = () => {
      document.body.classList.add('dragLook');
      document.body.classList.remove('playing');
      $('hint').textContent = 'hold the mouse button to look \u00b7 O settings \u00b7 H hide';
      toast('hold the mouse button to look around');
    };

    input.onKey = (e) => {
      if (gate.classList.contains('gone') === false) return;
      switch (e.code) {
        case 'KeyO': togglePanel(); break;
        case 'KeyH': s.showHud = !s.showHud; applyHud(s); saveSettings(s); break;
        case 'KeyM':
          s.sound = !s.sound; audio.setEnabled(s.sound); saveSettings(s);
          syncPanel(); toast(s.sound ? 'sound on' : 'sound off'); break;
        case 'KeyR':
          world.pos[0] = 0; world.pos[2] = 0; world.vel[0] = world.vel[2] = 0;
          world.trample.clear(); toast('back to the middle'); break;
        case 'KeyP': screenshot(); break;
      }
    };

    /* ---------------- loop ---------------- */
    let last = performance.now();
    let frames = 0, fpsT = 0;
    let msAvg = 16.7;

    function frame(now) {
      if (!running) return;
      requestAnimationFrame(frame);
      let dt = (now - last) / 1000;
      last = now;
      if (dt > 0.1) dt = 0.1;              /* a tab that was in the background */
      if (dt <= 0) return;

      const t0 = performance.now();
      world.step(dt, input, audio);
      world.render(dt);
      msAvg = msAvg * 0.92 + (performance.now() - t0) * 0.08;

      frames++; fpsT += dt;
      if (fpsT >= 0.5) {
        world.fps = frames / fpsT;
        frames = 0; fpsT = 0;
        updateReadout(world, msAvg);
        if (world.settings.quality === 'auto') autoQuality(world, msAvg);
      }
      updateCompass(world);
    }
    requestAnimationFrame(frame);
  }

  /* ---------------------------------------------------------------- */
  function autoQuality(world, ms) {
    /* Aim for a comfortable 60. Two separate knobs, because they cost
       very different things: grass density is free to change every time
       we look at it, while changing the resolution reallocates every
       render target we own. The old version reallocated ~460 MB of
       buffers for a 0.3% area change, twice a second. */
    const prev = world.autoScale;
    /* Comes down fast and goes back up slowly. autoScale now also scales
       the blade budget, so this is the loop that actually finds a load
       the machine can carry - it could not do that before, when the
       instance count was fixed by a camera-centred square. */
    if (ms > 28) world.autoScale = Math.max(0.22, world.autoScale - 0.18);
    else if (ms > 20) world.autoScale = Math.max(0.22, world.autoScale - 0.08);
    else if (ms < 11 && world.autoScale < 1.0) world.autoScale = Math.min(1.0, world.autoScale + 0.04);

    const now = performance.now();
    const moved = Math.abs(world.autoScale / (prev || 1) - 1);
    if (moved > 0.06 && now - world.lastResizeAt > 1500) {
      world.lastResizeAt = now;
      world.resize();
    }
  }

  function updateReadout(world, ms) {
    if (!world.settings.showHud) return;
    $('rFps').textContent =
      Math.round(world.fps) + ' fps · ' + ms.toFixed(1) + ' ms';
    const dirDeg = ((world.windAngle * 180 / Math.PI) % 360 + 360) % 360;
    $('rWind').textContent =
      'wind ' + Math.round(world.windStrength * 100) + '% · ' +
      Math.round(dirDeg) + '° · ' +
      (world.grass.instanceCount / 1000).toFixed(0) + 'k blades';
    $('rPos').textContent =
      world.pos[0].toFixed(0) + ', ' + world.pos[2].toFixed(0) + ' m  ·  ' +
      world.canvas.width + '\u00d7' + world.canvas.height +
      (world.samples > 1 ? '  ' + world.samples + '\u00d7 AA' : '');
  }

  const CARDINALS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  let tapeBuilt = false;
  let compassW = -1, compassDirty = true;
  function updateCompass(world) {
    const tape = $('compassTape');
    if (!tapeBuilt) {
      let html = '';
      for (let rep = 0; rep < 3; rep++)
        for (let i = 0; i < 24; i++) {
          const deg = i * 15;
          const label = deg % 45 === 0 ? CARDINALS[(deg / 45) | 0] : '·';
          html += '<span style="width:26px">' + label + '</span>';
        }
      tape.innerHTML = html;
      tapeBuilt = true;
    }
    const deg = ((world.yaw * 180 / Math.PI) % 360 + 360) % 360;
    /* cached: reading clientWidth every frame forces a layout */
    if (compassW < 0 || compassDirty) { compassW = tape.parentElement.clientWidth; compassDirty = false; }
    /* 26 px per 15 degrees; the middle repeat keeps it continuous */
    const x = -(deg / 15) * 26 - 24 * 26 + compassW * 0.5;
    tape.style.transform = 'translateX(' + x + 'px)';
  }

  function applyHud(s) {
    $('hud').classList.toggle('hidden', !s.showHud);
  }

  /* ---------------------------------------------------------------- */
  let panelRows = [];

  function togglePanel() {
    const p = $('panel');
    const opening = p.classList.contains('hidden');
    p.classList.toggle('hidden');
    if (opening && document.pointerLockElement) document.exitPointerLock();
  }

  function buildPanel(world, input, audio) {
    const s = world.settings;
    const body = $('panelBody');
    body.innerHTML = '';
    panelRows = [];

    for (const c of CONTROLS) {
      if (c.grp) {
        const h = document.createElement('div');
        h.className = 'grp'; h.textContent = c.grp;
        body.appendChild(h);
        continue;
      }
      const row = document.createElement('div');
      row.className = 'row';
      const lab = document.createElement('label');
      lab.textContent = c.label;
      row.appendChild(lab);

      let read = null, ctl;
      if (c.toggle) {
        ctl = document.createElement('div');
        ctl.className = 'sw' + (s[c.k] ? ' on' : '');
        ctl.addEventListener('click', () => {
          s[c.k] = !s[c.k];
          ctl.classList.toggle('on', s[c.k]);
          apply(c, world, input, audio);
        });
      } else if (c.select) {
        ctl = document.createElement('select');
        for (const [v, t] of c.select) {
          const o = document.createElement('option');
          o.value = v; o.textContent = t;
          ctl.appendChild(o);
        }
        ctl.value = s[c.k];
        ctl.addEventListener('change', () => {
          s[c.k] = ctl.value;
          applyQuality(world);
          apply(c, world, input, audio);
        });
      } else {
        ctl = document.createElement('input');
        ctl.type = 'range';
        ctl.min = c.min; ctl.max = c.max; ctl.step = c.step;
        ctl.value = s[c.k];
        read = document.createElement('span');
        read.className = 'val';
        const fmt = () => {
          const v = s[c.k];
          read.textContent = (c.step < 0.01 ? v.toFixed(4)
                            : c.step < 0.1 ? v.toFixed(2)
                            : v.toFixed(0)) + (c.unit || '');
        };
        ctl.addEventListener('input', () => {
          s[c.k] = parseFloat(ctl.value);
          fmt();
          apply(c, world, input, audio);
        });
        fmt();
      }
      row.appendChild(ctl);
      if (read) row.appendChild(read);
      body.appendChild(row);

      if (c.note) {
        const n = document.createElement('div');
        n.className = 'hintline'; n.textContent = c.note;
        body.appendChild(n);
      }
      panelRows.push({ c, ctl, read });
    }

    $('panelClose').addEventListener('click', togglePanel);
    $('btnReset').addEventListener('click', () => {
      Object.assign(world.settings, DEFAULTS);
      world.rw = world.rh = 0;
      clearSafeRestart();
      applyQuality(world);
      input.sensitivity = world.settings.sensitivity;
      input.invertY = world.settings.invertY;
      audio.setEnabled(world.settings.sound);
      audio.setVolume(world.settings.volume);
      world.resize();
      applyHud(world.settings);
      saveSettings(world.settings);
      syncPanel();
      toast('defaults restored');
    });
    if (!CAN_DOWNLOAD) $('btnShot').textContent = 'Photo mode (H)';
    $('btnShot').addEventListener('click', () => {
      if (!CAN_DOWNLOAD) {
        world.settings.showHud = !world.settings.showHud;
        applyHud(world.settings); saveSettings(world.settings);
        togglePanel();
        return;
      }
      screenshot();
    });
    const diagBtn = $('btnDiag');
    if (diagBtn) diagBtn.addEventListener('click', () => {
      const text = diagnostics();
      console.log(text);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => toast('diagnostics copied'))
          .catch(() => toast('diagnostics printed to the console'));
      } else {
        toast('diagnostics printed to the console');
      }
    });
  }

  function syncPanel() {
    const s = window.__world.settings;
    for (const { c, ctl, read } of panelRows) {
      if (c.toggle) ctl.classList.toggle('on', !!s[c.k]);
      else if (c.select) ctl.value = s[c.k];
      else {
        ctl.value = s[c.k];
        if (read) read.textContent = (c.step < 0.01 ? s[c.k].toFixed(4)
                                    : c.step < 0.1 ? s[c.k].toFixed(2)
                                    : s[c.k].toFixed(0)) + (c.unit || '');
      }
    }
  }

  function applyQuality(world) {
    const s = world.settings;
    const p = QUALITY_PRESETS[s.quality];
    if (p) { s.renderScale = p.renderScale; world.autoScale = 1.0; }
    else { world.autoScale = clamp(world.autoScale, 0.45, 1.0); }
    world.resize();
    syncPanel();
  }

  function apply(c, world, input, audio) {
    const s = world.settings;
    if (c.k === 'sensitivity') input.sensitivity = s.sensitivity;
    if (c.k === 'invertY') input.invertY = s.invertY;
    if (c.k === 'sound') audio.setEnabled(s.sound);
    if (c.k === 'volume') audio.setVolume(s.volume);
    if (c.k === 'showHud') applyHud(s);
    if (c.k === 'msaa' || c.k === 'quality') world.rw = world.rh = 0;
    if (c.needsResize) world.resize();
    saveSettings(s);
  }

  /* ---------------------------------------------------------------- */
  let toastT = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 1600);
  }

  /* Hosted in a frame, a download link is inert - the viewer never grants
     the page permission to hand you a file. Better to say so than to
     claim the frame was saved and quietly do nothing. */
  const CAN_DOWNLOAD = (() => { try { return window.self === window.top; } catch (e) { return false; } })();

  function screenshot() {
    if (!world) return;
    if (!CAN_DOWNLOAD) {
      toast('use your device\u2019s own screenshot here');
      return;
    }
    world.requestShot((blob) => {
      if (!blob) { toast('could not save the frame'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dark-sky-reserve-' + Date.now() + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('frame saved');
    });
  }

  /** Everything worth knowing if it still will not run somewhere. */
  function diagnostics() {
    const lines = [];
    lines.push('Dark Sky Reserve — diagnostics');
    lines.push('userAgent: ' + navigator.userAgent);
    lines.push('devicePixelRatio: ' + devicePixelRatio +
               '   window: ' + innerWidth + 'x' + innerHeight);
    if (world) {
      const gl = world.glw.gl;
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      lines.push('renderer: ' + (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
      lines.push('vendor: ' + (dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR)));
      lines.push('version: ' + gl.getParameter(gl.VERSION));
      lines.push('drawing buffer: ' + world.canvas.width + 'x' + world.canvas.height +
                 '  (' + (world.canvas.width * world.canvas.height / 1e6).toFixed(2) + ' MP)' +
                 '  msaa: ' + world.samples + 'x');
      lines.push('vram budget: ' + world.settings.vramBudget + ' MB' +
                 '   autoScale: ' + world.autoScale.toFixed(2));
      lines.push('half-float targets: ' + world.glw.hdr +
                 '   colour_buffer_half_float: ' + !!world.glw.extHalf +
                 '   colour_buffer_float: ' + !!world.glw.extFloat);
      lines.push('MAX_TEXTURE_SIZE: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE) +
                 '   MAX_RENDERBUFFER_SIZE: ' + gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) +
                 '   MAX_SAMPLES: ' + gl.getParameter(gl.MAX_SAMPLES));
      lines.push('fps: ' + world.fps.toFixed(1) + '   blades submitted: ' + world.grass.instanceCount +
                 '   budget: ' + world.settings.maxBlades + 'k');
      const st = world.selfTest || {};
      lines.push('self-test  vertexTextureFetch: ' + st.vertexTextureFetch +
                 '   halfFloatTargets: ' + st.halfFloatTargets +
                 '   msaaResolve: ' + st.msaaResolve);
      if (st.notes && st.notes.length) lines.push('self-test notes: ' + st.notes.join(' | '));
      lines.push('glGetError: ' + gl.getError() + '   contextLost: ' + gl.isContextLost());
      lines.push('settings: ' + JSON.stringify(world.settings));
    } else {
      lines.push('renderer never started');
    }
    return lines.join('\n');
  }

  /* expose for the panel's sync helper and for poking at from a console */
  Object.defineProperty(window, '__world', { get: () => world });
}

if (document.readyState === 'loading') addEventListener('DOMContentLoaded', boot);
else boot();

</script>
